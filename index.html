    function createDeck() {
        state.deck = [];
        // 序数牌
        for (let suit of SUITS) {
            for (let num of NUMBERS) {
                for (let i = 0; i < 4; i++) {
                    state.deck.push(num + suit);
                }
            }
        }
        // 字牌
        for (let wind of WINDS) {
            for (let i = 0; i < 4; i++) {
                state.deck.push(wind + '风');
            }
        }
        for (let dragon of DRAGONS) {
            for (let i = 0; i < 4; i++) {
                state.deck.push(dragon);
            }
        }
        // 移除花牌逻辑
    }

    function shuffleDeck() {
        for (let i = state.deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [state.deck[i], state.deck[j]] = [state.deck[j], state.deck[i]];
        }
    }

    function dealInitialHands() {
        // 每人发13张
        for (let i = 0; i < 13; i++) {
            for (let player of state.players) {
                const tile = state.deck.pop();
                player.hand.push(tile);
            }
        }
        state.players.forEach(p => {
            sortHand(p.hand);

            // Prism New 2: 天命所归 (Start of round, assign random wildcard)
            if (playerHasHextechId(p, 'prism_new_2')) {
                const allTypes = [];
                SUITS.forEach(s => NUMBERS.forEach(n => allTypes.push(n+s)));
                WINDS.forEach(w => allTypes.push(w+'风'));
                DRAGONS.forEach(d => allTypes.push(d));
                p.wildcardTile = allTypes[Math.floor(Math.random() * allTypes.length)];
                
                // 如果是玩家，提示一下
                if (p.id === 0) {
                     // 稍微延迟一下，确保渲染完成后提示
                     setTimeout(() => {
                         const msgEl = document.getElementById('message-area');
                         if (msgEl) {
                             msgEl.innerHTML = `<h3 style="color:#e066ff">【天命所归】</h3><p>本局万能牌：${getTileVisual(p.wildcardTile)}</p>`;
                             msgEl.style.display = 'block';
                             setTimeout(() => msgEl.style.display = 'none', 3000);
                         }
                     }, 1000);
                }
            } else {
                p.wildcardTile = null;
            }
        });
    }

    function getTileWeight(tile) {
        if (!tile) return 999;
        const suitsOrder = {'万': 0, '筒': 1, '条': 2};
        const numbersOrder = {'一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9};
        const windsOrder = {'东':0, '南':1, '西':2, '北':3};
        const dragonsOrder = {'中':0, '发财':1, '白板':2};

        // 序数牌
        const suit = tile.slice(-1);
        const num = tile.slice(0, -1);
        if (suitsOrder[suit] !== undefined) {
            return suitsOrder[suit] * 100 + (numbersOrder[num] || 0);
        }

        // 字牌
        if (windsOrder[tile] !== undefined) {
            return 300 + windsOrder[tile];
        }
        if (dragonsOrder[tile] !== undefined) {
            return 350 + dragonsOrder[tile];
        }
        
        return 999;
    }

    // --- 游戏流程控制 ---

    function nextTurn() {
        if (state.gameOver) return;
        state.actionProcessing = false; // Reset lock for new turn

        state.currentPlayerIndex = (state.currentPlayerIndex + 1) % 4;
        const localIdx = getServerToLocalIndex(state.currentPlayerIndex);
        const currentPlayer = state.players[localIdx];
        
        // Track Turn Count (Round)
        if (state.currentPlayerIndex === state.dealerId) {
            state.turnCount++;
        }

        // Prism New 5: 孤注一掷 (报听后无法摸牌)
        if (currentPlayer.isTing && playerHasHextechId(currentPlayer, 'prism_new_5')) {
            // Check for potential infinite loop (everyone has this hextech and is ting)
            state.skippedTurnCount = (state.skippedTurnCount || 0) + 1;
            if (state.skippedTurnCount >= 4) {
                 const resultMsg = calculateRoundEnd('liuju', null, null);
                 endGame(`流局！所有人都无法摸牌。<br>${resultMsg}`);
                 return;
            }
            
            // Skip turn
            // speak('跳过');
            // Just move to next player after short delay
            setTimeout(nextTurn, 200);
            return;
        } else {
            state.skippedTurnCount = 0; // Reset counter on valid turn
        }
        
        // Reset discardsNeeded
        currentPlayer.discardsNeeded = 1;
        // currentPlayer.goldNew5Used = false; // Reset Resource Recycle usage (Now per-round, reset in startNextRound)
        
        // 开启倒计时
        startTurnTimer();
        
        // 普通摸牌，非杠上开花
        state.isGangKai = false;
        
        updateStatus();

        // 摸牌
        const drawnTile = drawCard(currentPlayer);
        
        // Fix 1: Check for Game Over (Liuju) immediately
        if (state.gameOver) return;

        // 渲染前清理听牌模式状态
        state.isTingMode = false;
        state.tingCandidates = {};

        render();

        if (currentPlayer.isAi) {
            setTimeout(() => aiPlay(currentPlayer), 1000); // 延迟让玩家看清
        } else {
            // 玩家回合
            if (currentPlayer.isTing) {
                // 如果已经听牌
                
                // 1. Check Win (Zimo)
                const winResult = calculateScore(currentPlayer);
                
                // 2. Check Gang (An Gang & Added Gang)
                const anGangCandidates = getAnGangCandidates(currentPlayer.hand);
                const addedGangCandidates = getAddedGangCandidates(currentPlayer.hand, currentPlayer.peng);
                const canGang = anGangCandidates.length > 0 || addedGangCandidates.length > 0;
                
                let hasAction = false;

                if (winResult.canWin) {
                     hasAction = true;
                     document.getElementById('btn-hu').style.display = 'flex';
                     document.getElementById('btn-hu').onclick = () => {
                        speak('自摸');
                        const winType = state.isGangKai ? 'gangkai' : 'zimo';
                        const resultMsg = calculateRoundEnd(winType, currentPlayer.id, null);
                        endGame(`${winType === 'gangkai' ? '杠上开花' : '自摸'}！<br>${resultMsg}`);
                     };
                }
                
                if (canGang) {
                     hasAction = true;
                     const btnGang = document.getElementById('btn-gang');
                     btnGang.style.display = 'flex';
                     btnGang.onclick = () => {
                         // Default logic: Added Gang first, then An Gang
                         if (addedGangCandidates.length > 0) {
                             performAddedGang(currentPlayer, addedGangCandidates[0]);
                         } else {
                             performAnGang(currentPlayer, anGangCandidates[0]);
                         }
                     };
                }

                if (hasAction) {
                     // Show Skip button
                     const btnSkip = document.getElementById('btn-pass');
                     btnSkip.style.display = 'flex';
                     btnSkip.onclick = () => {
                        hideInteractionButtons();
                        discardTile(currentPlayer, currentPlayer.hand.length - 1);
                     };
                     speak(winResult.canWin ? '自摸' : '杠');
                } else {
                    // 没胡也没杠，自动打出刚摸到的牌
                    setTimeout(() => {
                        if (!state.gameOver) {
                            discardTile(currentPlayer, currentPlayer.hand.length - 1);
                        }
                    }, 1000);
                }
            } else {
                // 未听牌，正常等待操作
                checkActions();
            }
        }
    }

    function aiPlay(aiPlayer) {
        if (state.gameOver) return;

        // 简单AI：随机或者打出刚摸到的
        // 稍微智能一点：打出单张字牌，或者序数牌里无法成顺的
        // 这里为了简单，先随机打出一张牌
        const handSize = aiPlayer.hand.length;
        const discardIndex = Math.floor(Math.random() * handSize);
        const tileToDiscard = aiPlayer.hand[discardIndex];

        discardTile(aiPlayer, discardIndex);
    }

    function discardTile(player, tileIndex, isTingDiscard = false) {
        if (player.id !== state.myServerId) return;
        if (typeof state.myServerId === 'undefined') return;

        stopTurnTimer(); // 停止倒计时

        const tile = player.hand[tileIndex];

        // Emit discard event to server
        socket.emit('discard', {
            roomName: currentRoomName,
            tile: tile,
            tileIndex: tileIndex,
            isTing: isTingDiscard
        });

        // Clear local selection immediately for better UX
        state.selectedTileIndex = -1;
        
        // Note: Hand update and rendering will happen upon receiving 'updateState'
    }

    function processPendingDiscards() {
        if (!state.pendingDiscards || state.pendingDiscards.length === 0) {
            nextTurn();
            return;
        }

        // 取出队列中的第一张
        const discardInfo = state.pendingDiscards.shift();
        const player = state.players[discardInfo.playerIndex];
        const tile = discardInfo.tile;
        const isTingDiscard = discardInfo.isTingDiscard;

        state.isGangKaiDiscard = state.isGangKai;
        state.lastDiscard = { playerIndex: player.id, tile: tile, isTingDiscard: isTingDiscard };
        
        // 语音播报
        if (isTingDiscard) {
            speak('听');
        } else {
            speak(tile);
        }

        // Check Prism New 8: 绝户计 (别人不能碰、不能杠)
        const canOthersInteract = !playerHasHextechId(player, 'prism_new_8');

        // 检查其他人是否要碰/杠/胡
        if (!player.isAi) {
            // 玩家出牌，理论上AI应该检查。但当前代码简化了AI不碰杠。
            // 保持原有逻辑：直接下一位（或递归处理下一张弃牌）
            // 如果未来添加AI碰杠，代码应加在这里。
            
            // 递归处理下一张弃牌（如果有）
            // 只有当没有任何互动发生时，才处理下一张。
            // 我们可以用一个小延时让玩家看清楚
            if (state.pendingDiscards.length > 0) {
                setTimeout(() => processPendingDiscards(), 800);
            } else {
                setTimeout(() => nextTurn(), 500);
            }
        } else {
            // AI出牌，检查玩家是否可以碰杠胡
            const human = state.players[0];
            let canPeng = checkCanPeng(human, tile);
            let canGang = checkCanGang(human, tile);
            let canHu = checkCanHuFromDiscard(human, tile);

            // Prism New 8 Constraint
            if (!canOthersInteract) {
                canPeng = false;
                canGang = false;
            }

            // 规则变更：必须先听牌才能胡
            if (!human.isTing) {
                canHu = false;
            }

            // 听牌状态下不能碰，也不能明杠
            if (human.isTing) {
                canPeng = false;
                // canGang = false; 
            }

            // Prism New 12: 不动如山 (不碰、不杠直到胡牌)
            if (playerHasHextechId(human, 'prism_new_12')) {
                canPeng = false;
                canGang = false;
            }

            // Prism New 9: 铁壁 (discarder has prism_new_9 and is NOT ting -> others cannot Hu)
            if (playerHasHextechId(player, 'prism_new_9') && !player.isTing) {
                canHu = false;
            }

            if (canPeng || canGang || canHu) {
                // 暂停流程，显示按钮
                showInteractionButtons(canPeng, canGang, canHu);
                // 注意：这里函数结束，不再调用 nextTurn 或 processPendingDiscards
                // 等待玩家点击“过”、“碰”、“杠”、“胡”
                // 如果玩家点“过”，必须调用 processPendingDiscards() 而不是 nextTurn()
            } else {
                // 无互动，继续处理下一张
                if (state.pendingDiscards.length > 0) {
                    setTimeout(() => processPendingDiscards(), 800);
                } else {
                    setTimeout(() => nextTurn(), 500);
                }
            }
        }
    }

    // --- 交互逻辑 ---

    function onTileClick(playerIndex, tileIndex) {
        if (state.gameOver) return;
        if (state.actionProcessing) return;
        if (playerIndex !== 0) return;
        if (state.currentPlayerIndex !== state.myServerId && !state.archmageSwapMode) return;
        
        if (state.archmageSwapMode) {
            var arr = state.archmageSelectedIndices || [];
            var idx = arr.indexOf(tileIndex);
            if (idx >= 0) arr.splice(idx, 1);
            else if (arr.length < 3) arr.push(tileIndex);
            state.archmageSelectedIndices = arr;
            render();
            if (arr.length === 3) {
                state.archmageSwapMode = false;
                state.archmageSelectedIndices = [];
                var msgEl = document.getElementById('message-area');
                if (msgEl) msgEl.style.display = 'none';
                socket.emit('action', { roomName: currentRoomName, type: 'archmageSwap', data: { handIndices: arr.slice().sort(function(a,b){ return a-b; }) } });
            }
            return;
        }
        
        if (state.currentPlayerIndex !== state.myServerId) return;
        
        if (state.resourceRecycleMode) {
            state.swapSourceTileIndex = tileIndex;
            speak('请选择弃牌区的一张牌');
            render(); // Update visual to show selection
            return;
        }

        const player = state.players[0];

        // 听牌后逻辑
        if (player.isTing) {
            // 只有轮到自己且有14张牌时，才允许手动打出最后一张摸到的牌
            const isMyTurn = (state.currentPlayerIndex === state.myServerId);
            const hasDrawn = (player.hand.length % 3 === 2);
            if (isMyTurn && hasDrawn && tileIndex === player.hand.length - 1) {
                // 允许打出最后一张
                state.selectedTileIndex = tileIndex;
                onDiscardBtnClick(); 
            }
            return;
        }

        // Silver 3: 摸排入门 Swap Logic
        if (state.swapMode) {
             const tileToSwap = player.hand[tileIndex];
             socket.emit('action', {
                 roomName: currentRoomName,
                 type: 'swap',
                 data: { tile: tileToSwap }
             });
             state.swapMode = false;
             document.getElementById('message-area').style.display = 'none';
             return;
        }

        // 听牌模式下的点击处理
        if (state.isTingMode) {
            // 只能点击可以听牌的候选牌
            if (state.tingCandidates[tileIndex]) {
                // 确认听牌并打出
                state.isTingMode = false;
                socket.emit('discard', {
                    roomName: currentRoomName,
                    tile: player.hand[tileIndex],
                    tileIndex: tileIndex,
                    isTing: true
                });
            } else {
                state.isTingMode = false;
                state.selectedTileIndex = tileIndex;
                document.getElementById('btn-discard').disabled = false;
                render();
            }
            return;
        }
        
        if (state.selectedTileIndex === tileIndex) {
            onDiscardBtnClick();
        } else {
            // 选中
            state.selectedTileIndex = tileIndex;
            document.getElementById('btn-discard').disabled = false;
            render();
        }
    }

    function onGangClick() {
        if (state.gameOver) return;
        if (state.actionProcessing) return;
        
        const player = state.players[0];
        let tile = null;
        let type = 'ming';
        
        if (state.pendingServerActions && state.pendingServerActions.length > 0) {
            var gangAction = state.pendingServerActions.find(function(a){ return a.type === 'gang'; });
            if (gangAction && gangAction.data) {
                type = gangAction.data.type || type;
                tile = gangAction.data.tile !== undefined ? gangAction.data.tile : tile;
            }
            state.pendingServerActions = null;
        } else if (state.currentPlayerIndex === state.myServerId) {
            // Self-turn: AnGang, AddedGang, or AnJian
            const anGangCandidates = getAnGangCandidates(player.hand);
            const addedGangCandidates = getAddedGangCandidates(player.hand, player.peng);
            
            if (anGangCandidates.length > 0) {
                tile = anGangCandidates[0];
                type = 'an';
            } else if (addedGangCandidates.length > 0) {
                tile = addedGangCandidates[0];
                type = 'added';
            } else if (pHasHex(player, 'prism_3')) {
                // Prism 3: 暗箭难防 (Triplets as AnGang)
                const triplets = getTripletCandidates(player.hand);
                player.anJianUsedTiles = player.anJianUsedTiles || [];
                const anJianCandidates = triplets.filter(t => !player.anJianUsedTiles.includes(t));
                if (anJianCandidates.length > 0) {
                    tile = anJianCandidates[0];
                    type = 'an'; // Server treats AnJian as AnGang
                    player.anJianUsedTiles.push(tile);
                }
            }
        }
        // If not self-turn, it's MingGang, tile will be null and server will use lastDiscard.tile

        state.actionProcessing = true;
        hideInteractionButtons();

        socket.emit('action', { 
            roomName: currentRoomName, 
            type: 'gang',

    // --- 界面渲染 ---
    
    // --- 界面渲染 ---
    
    function getAnGangCandidates(hand) {
        const counts = {};
        hand.forEach(t => counts[t] = (counts[t] || 0) + 1);
        return Object.keys(counts).filter(t => counts[t] === 4);
    }
    
    function getAddedGangCandidates(hand, pengs) {
        // 碰过的牌在 pengs 数组里
        // 检查手牌里有没有碰过的牌
        return pengs.filter(p => hand.includes(p));
    }
    
    function performAnGang(player, tile) {
        if (state.gameOver) return;
        if (state.actionProcessing) return;
        state.actionProcessing = true;
        hideInteractionButtons();
        speak('暗杠');
        
        let score = 2;
        // Gold 1: 疯狂杠精 (所有杠分翻倍)
        if (playerHasHextechId(player, 'gold_1')) {
            score *= 2;
        }

        // 记录杠分: 暗杠，其余三家各支付2分
        state.players.forEach(p => {
            if (p.id !== player.id) {
                state.roundGangScores.push({
                    from: p.id,
                    to: player.id,
                    score: score,
                    type: '暗杠'
                });
            }
        });

        // 移除手牌4张
        let count = 0;
        for (let i = player.hand.length - 1; i >= 0; i--) {
            if (player.hand[i] === tile && count < 4) {
                player.hand.splice(i, 1);
                count++;
            }
        }
        player.gang.push(tile); // 记录杠
        
        state.isGangKai = true;

        // 正常: 摸一张
        drawCard(player);
        
        // 重新检查动作 (可能杠上开花，或者继续杠)
        hideInteractionButtons();
        render();
        checkActions();
        state.actionProcessing = false;
    }
    
    function performAddedGang(player, tile) {
        if (state.gameOver) return;
        if (state.actionProcessing) return;
        state.actionProcessing = true;
        hideInteractionButtons();
        speak('杠'); // 加杠通常也喊杠
        
        let score = 1;
        // Silver 6: 补杠达人 (补杠时每家额外支付1分)
        if (playerHasHextechId(player, 'silver_6')) {
            score += 1;
        }
        // Gold 1: 疯狂杠精 (所有杠分翻倍)
        if (playerHasHextechId(player, 'gold_1')) {
            score *= 2;
        }

        // 记录杠分: 补杠(面下杠)，其余三家各支付1分
        state.players.forEach(p => {
            if (p.id !== player.id) {
                state.roundGangScores.push({
                    from: p.id,
                    to: player.id,
                    score: score,
                    type: '补杠'
                });
            }
        });

        // 移除手牌1张
        const idx = player.hand.indexOf(tile);
        if (idx > -1) player.hand.splice(idx, 1);
        
        // 从碰移动到杠
        const pIdx = player.peng.indexOf(tile);
        if (pIdx > -1) player.peng.splice(pIdx, 1);
        
        player.gang.push(tile);
        
        state.isGangKai = true;

        drawCard(player);
        
        hideInteractionButtons();
        render();
        checkActions();
        state.actionProcessing = false;
    }
    
    // Prism 3: 暗箭难防 - 刻子当暗杠
    function getTripletCandidates(hand) {
        const counts = {};
        hand.forEach(t => counts[t] = (counts[t] || 0) + 1);
        return Object.keys(counts).filter(t => counts[t] >= 3);
    }
    
    function performAnJian(player, tile) {
        if (state.gameOver) return;
        if (state.actionProcessing) return;
        state.actionProcessing = true;
        // Do not hide buttons here, as it might be used multiple times? 
        // But preventing double click on SAME tile is important.
        // checkActions filters used tiles. 
        // If we don't hide, user can double click.
        // If we hide, it flickers.
        // Let's hide.
        hideInteractionButtons();
        speak('暗箭');
        
        let score = 2; // 暗杠标准分
        // Gold 1: 疯狂杠精 (所有杠分翻倍)
        if (playerHasHextechId(player, 'gold_1')) {
            score *= 2;
        }
        
        // 记录杠分 (暗杠类型)
        state.players.forEach(p => {
            if (p.id !== player.id) {
                state.roundGangScores.push({
                    from: p.id,
                    to: player.id,
                    score: score,
                    type: '暗箭'
                });
            }
        });
        
        // Mark tile as used for An Jian to prevent re-use in same round?
        // Or re-use for next triplet? 
        // Logic: One triplet = one An Jian.
        // We need to track which *instance* of triplet is used.
        // Simple way: track "number of An Jian uses" vs "number of triplets".
        // But player might have 333 444. 
        // Let's store "usedTiles" list.
        player.anJianUsedTiles = player.anJianUsedTiles || [];
        player.anJianUsedTiles.push(tile);
        
        // Visual feedback?
        const msgEl = document.getElementById('message-area');
        msgEl.innerHTML = `<h3 style="color:#e066ff">暗箭难防</h3><p>手牌刻子【${tile}】已结算暗杠分！</p>`;
        msgEl.style.display = 'block';
        setTimeout(() => msgEl.style.display = 'none', 1500);
        
        // Does not change hand structure or draw card. Just adds score.
        // But need to update UI to disable button if no more candidates.
        checkActions();
        state.actionProcessing = false;
    }

    // 检查听牌辅助函数
    function getTingCandidates(hand, wildcardTile = null) {
        // 返回一个对象: { index: [winningTiles...] }
        // 遍历手牌中每一张牌，假设打出它，剩下的牌能否听牌
        const candidates = {};
        const uniqueTilesHand = [...new Set(hand)];
        
        // 优化：如果有两张一样的牌，只检查一次
        // 但我们需要返回具体的index，所以还是需要对index处理
        // 不过为了性能，我们可以先按tile去重检查，然后映射回index
        
        for (let i = 0; i < hand.length; i++) {
            const tileToDiscard = hand[i];
            
            // 复制一份手牌，移除这张
            const tempHand = [...hand];
            tempHand.splice(i, 1);
            
            // 检查tempHand听什么牌
            const winningTiles = getWinningTiles(tempHand, wildcardTile);
            if (winningTiles.length > 0) {
                candidates[i] = winningTiles;
            }
        }
        return candidates;
    }

    // 缓存所有可能的牌
    const ALL_POSSIBLE_TILES = [];
    for(let s of SUITS) for(let n of NUMBERS) ALL_POSSIBLE_TILES.push(n+s);
    for(let w of WINDS) ALL_POSSIBLE_TILES.push(w+'风');
    for(let d of DRAGONS) ALL_POSSIBLE_TILES.push(d);

    function getWinningTiles(hand13, wildcardTile = null) {
        // 尝试加入所有可能的牌，检查是否胡牌
        const winning = [];
        
        for (let tile of ALL_POSSIBLE_TILES) {
            // 简单剪枝：如果这张牌已经有4张了，就不可能再摸到了（除非杠，暂不考虑）
            // 但这里只判断"能否胡"，不判断"能否摸到"
            const tempHand = [...hand13, tile];
            if (checkWin(tempHand, [], [], wildcardTile)) { // 这里peng/gang传空，因为只看手牌结构
                 winning.push(tile);
            }
        }
        return winning;
    }

    function checkCanPeng(player, tile) {
        return player.hand.filter(t => t === tile).length >= 2;
    }

    function checkCanGang(player, tile) {
        return player.hand.filter(t => t === tile).length >= 3;
    }

    function checkCanHuFromDiscard(player, tile) {
        // 别人听牌的那张牌不能胡 (听牌宣言牌免疫)
        if (state.lastDiscard && state.lastDiscard.isTingDiscard) return false;

        // Prism New 9: 铁壁 (只要你没听牌，你打出的任何牌别人都不能胡)
        // Check if lastDiscard source exists and has hextech
        if (state.lastDiscard && state.lastDiscard.playerIndex !== undefined) {
             const discarder = state.players[state.lastDiscard.playerIndex];
             if (playerHasHextechId(discarder, 'prism_new_9') && !discarder.isTing) {
                 return false;
             }
        }

        // 简单的胡牌检测逻辑: 必须有一对将，其他都是刻子或顺子
        // 为了不破坏原手牌，克隆一份
        
        // 如果打出的牌是万能牌，它不能作为赖子使用 (仅手牌有效)
        // 逻辑：计算手牌中的赖子数量，然后将打出的牌作为普通牌加入，再调用checkWin(wildcard=null, extraGhosts=count)
        let tempHand = [...player.hand];
        let ghosts = 0;
        
        if (player.wildcardTile) {
            // 计算手牌中已有的赖子
            const count = tempHand.filter(t => t === player.wildcardTile).length;
            ghosts = count;
            // 移除手牌中的赖子
            tempHand = tempHand.filter(t => t !== player.wildcardTile);
        }
        
        // 加入打出的牌 (作为普通牌)
        tempHand.push(tile);
        sortHand(tempHand);
        
        return checkWin(tempHand, player.peng, player.gang, null, ghosts);
    }

    function checkActions() {
        // 检查玩家自己回合的动作 (暗杠、自摸胡、听牌)
        const player = state.players[0];
        // Ensure we only check actions if it's effectively our turn
        // The server sends updateState, if currentPlayerIndex matches myServerId
        const isMyTurn = (state.currentPlayerIndex === state.myServerId);
        
        if (isMyTurn) {
            // 胡牌检测
            // Note: In server-authoritative, we might wait for server to say "canHu"
            // But for responsiveness, we check locally. Server will validate.
            const winResult = calculateScore(player);
            // 规则变更：必须先听牌才能胡 (Keep local rule check)
            if (winResult.canWin && player.isTing) {
                document.getElementById('btn-hu').style.display = 'flex';
                document.getElementById('btn-hu').onclick = onHuClick;
            } else {
                document.getElementById('btn-hu').style.display = 'none';
            }
            
            // 暗杠/加杠检测
            const anGangCandidates = getAnGangCandidates(player.hand);
            const addedGangCandidates = getAddedGangCandidates(player.hand, player.peng);
            
            // Prism 3: 暗箭难防 (刻子当暗杠)
            let anJianCandidates = [];
            if (playerHasHextechId(player, 'prism_3')) {
                const triplets = getTripletCandidates(player.hand);
                player.anJianUsedTiles = player.anJianUsedTiles || [];
                anJianCandidates = triplets.filter(t => !player.anJianUsedTiles.includes(t));
            }
            
            // Combine all gang types into one button or separate?
            // Original code had separate btn-anjian. Let's keep it if UI supports it, 
            // or merge into btn-gang logic.
            // If we have specific btn-anjian in HTML, use it.
            // But simpler to handle inside onGangClick if we merge buttons.

    function toggleResourceRecycleMode() {
        if (state.resourceRecycleMode) {
            // Cancel
            state.resourceRecycleMode = false;
            state.swapSourceTileIndex = -1;
            render();
        } else {
            // Enable
            state.resourceRecycleMode = true;
            state.swapSourceTileIndex = -1;
            speak('请先选择一张手牌');
            render();
        }
    }

    function performResourceSwap(discardIndex) {
        if (state.gameOver) return;
        const player = state.players[0]; // Human only
        
        // Validation
        if (!state.resourceRecycleMode) return;
        if (state.swapSourceTileIndex === -1) {
            speak('请先选择一张手牌');
            return;
        }
        
        // 验证：弃牌区有这张牌
        if (discardIndex < 0 || discardIndex >= player.discards.length) return;
        
        // Execute Swap via Server
        const handTile = player.hand[state.swapSourceTileIndex];
        const discardTile = player.discards[discardIndex];
        
        socket.emit('action', {
            roomName: currentRoomName,
            type: 'swap',
            data: {
                handTile: handTile,
                discardTile: discardTile,
                discardIdx: discardIndex
            }
        });
        
        state.resourceRecycleMode = false;
        state.swapSourceTileIndex = -1;
        
        speak('资源回收');
        render();
    }

    // 核心算法：判断是否胡牌 (递归回溯)
    // wildcardTile: 玩家拥有的万能牌（天命所归）
    // extraGhosts: 外部传入的额外赖子数量 (用于处理特殊情况，如点炮时手里的赖子生效但点炮牌不生效)
    function checkWin(handTiles, pengs, gangs, wildcardTile = null, extraGhosts = 0) {
        // 花牌不参与胡牌计算
        
        // 处理万能牌逻辑
        let effectiveHand = [...handTiles];
        let ghostCount = extraGhosts;
        
        if (wildcardTile) {
            const count = effectiveHand.filter(t => t === wildcardTile).length;
            if (count > 0) {
                ghostCount += count;
                effectiveHand = effectiveHand.filter(t => t !== wildcardTile);
            }
        }

        // 手牌数量检查 (wildcard count is part of hand)
        if ((effectiveHand.length + ghostCount) % 3 !== 2) return false;
        
        // 排序，方便后续处理
        sortHand(effectiveHand);

        // 尝试找将牌 (DD)
        // 1. 使用现有牌做将
        const uniqueTiles = [...new Set(effectiveHand)];
        for (let pairTile of uniqueTiles) {
            // 需要几张赖子补足将牌?
            const c = effectiveHand.filter(t => t === pairTile).length;
            const need = 2 - c; // If c>=2, need 0. If c=1, need 1.
            const actualNeed = Math.max(0, need);
            
            if (ghostCount >= actualNeed) {
                const remaining = [...effectiveHand];
                // 移除用于做将的牌
                // We remove min(2, c) of pairTile
                for(let k=0; k<Math.min(2, c); k++) removeOne(remaining, pairTile);
                
                if (canFormSetsWithGhost(remaining, ghostCount - actualNeed)) return true;
            }
        }
        
        // 2. 如果有两个以上赖子，可以直接用两个赖子做将
        if (ghostCount >= 2) {
             if (canFormSetsWithGhost(effectiveHand, ghostCount - 2)) return true;
        }

        return false;
    }

    function canFormSetsWithGhost(tiles, ghosts) {
        if (tiles.length === 0) {
            return ghosts % 3 === 0;
        }
        
        // tiles already sorted in checkWin, but recursion slices, so maybe not?
        // We passed a copy/slice. Let's assume sorted or sort again.
        // sortHand(tiles); // Simple sort is fast
        
        const first = tiles[0];
        
        // 1. 尝试刻子 (AAA)
        // Count how many 'first' we have
        const c = tiles.filter(t => t === first).length;
        // We need 3.
        const need = Math.max(0, 3 - c); // e.g. have 1, need 2. have 3, need 0.
        
        if (ghosts >= need) {
            const newTiles = [...tiles];
            // Remove all 'first' (up to 3)
            for(let k=0; k<Math.min(3, c); k++) removeOne(newTiles, first);
            
            if (canFormSetsWithGhost(newTiles, ghosts - need)) return true;
        }
        
        // 2. 尝试顺子 (ABC)
        if (!WINDS.includes(first.charAt(0)) && !DRAGONS.includes(first)) {
            const suit = first.slice(-1);
            const numChar = first.slice(0, -1);
            const numIndex = NUMBERS.indexOf(numChar);
            
            if (numIndex <= 6) {
                const second = NUMBERS[numIndex + 1] + suit;
                const third = NUMBERS[numIndex + 2] + suit;
                
                // We need second and third.
                // Check if we have them.
                const hasSecond = tiles.includes(second);
                const hasThird = tiles.includes(third);
                
                let needSeq = 0;
                if (!hasSecond) needSeq++;
                if (!hasThird) needSeq++;
                
                if (ghosts >= needSeq) {
                    const newTiles = [...tiles];
                    removeOne(newTiles, first);
                    if (hasSecond) removeOne(newTiles, second);
                    if (hasThird) removeOne(newTiles, third);
                    
                    if (canFormSetsWithGhost(newTiles, ghosts - needSeq)) return true;
                }
            }
        }
        
        return false;
    }

    // Legacy wrapper if needed, or just replace usage
    function canFormSets(tiles) {
        return canFormSetsWithGhost(tiles, 0);
    }

    function removeOne(arr, item) {
        const idx = arr.indexOf(item);
        if (idx > -1) arr.splice(idx, 1);
    }

        if (localCurrentIdx2 === 0) activeId = 'bottom-player';
        if (localCurrentIdx2 === 1) activeId = 'right-player';
        if (localCurrentIdx2 === 2) activeId = 'top-player';
        if (localCurrentIdx2 === 3) activeId = 'left-player';
        
        const activeEl = document.getElementById(activeId);
        if (activeEl) {
            activeEl.style.opacity = '1';
            // activeEl.style.transform = 'scale(1.05)'; // Subtle highlight
            // Or add a glowing border indicator somewhere else, but opacity works for now
        }

        // Ensure hextech icons are visible
        renderPlayerHextechs();
    }

    // --- 界面渲染 ---

    function showInteractionButtonsLegacy(canPeng, canGang, canHu) {
        const actions = [];
        if (canHu) actions.push({ type: 'hu' });
        if (canPeng) actions.push({ type: 'peng' });
        if (canGang) actions.push({ type: 'gang' });
        showInteractionButtons(actions);
    }

    function showInteractionButtons(actions, tile) {
        const btnHu = document.getElementById('btn-hu');
        const btnPeng = document.getElementById('btn-peng');
        const btnGang = document.getElementById('btn-gang');
        const btnPass = document.getElementById('btn-pass');
        
        // Hide all first
        btnHu.style.display = 'none';
        btnPeng.style.display = 'none';
        btnGang.style.display = 'none';
        btnPass.style.display = 'none';

        if (!actions) return;

        actions.forEach(action => {
            if (action.type === 'hu') btnHu.style.display = 'block';
            if (action.type === 'peng') btnPeng.style.display = 'block';
            if (action.type === 'gang') btnGang.style.display = 'block';
        });

        if (actions.length > 0) {
            btnPass.style.display = 'block';
        }
    }

    function hideInteractionButtons() {
        document.getElementById('btn-hu').style.display = 'none';
        document.getElementById('btn-peng').style.display = 'none';
        document.getElementById('btn-gang').style.display = 'none';
        document.getElementById('btn-pass').style.display = 'none';
        var timerEl = document.getElementById('action-timer');
        if (timerEl) timerEl.style.display = 'none';
        if (state.actionTimerId) {
            clearInterval(state.actionTimerId);
            state.actionTimerId = null;
        }
    }

    function updateStatus() {
        // 可以在这里更新一些提示信息
    }

    function endGame(msg) {
        state.gameOver = true;
        
        let buttonHtml = '';
        if (state.currentRound < state.maxRounds) {
            buttonHtml = `<button onclick="startNextRound()" style="padding:10px 30px; font-size:20px; border-radius:30px; background:#4CAF50; color:white; border:none; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.3);">下一局</button>`;
        } else {
            // 最后一局，显示大结算
            msg += showFinalScoreboard();
            buttonHtml = `<button onclick="location.reload()" style="padding:10px 30px; font-size:20px; border-radius:30px; background:#f44336; color:white; border:none; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.3);">重新开始</button>`;
        }

        const msgEl = document.getElementById('message-area');
        msgEl.innerHTML = `
            <h2 style="margin:0 0 20px 0; font-size:32px; color:#ffd700;">${state.currentRound < state.maxRounds ? '本局结束' : '全场战绩'}</h2>
            <div style="font-size:20px; margin-bottom:30px; max-height:60vh; overflow-y:auto;">${msg}</div>
            ${buttonHtml}
        `;
        msgEl.style.display = 'block';
    }

    function showFinalScoreboard() {
        let html = "<hr><h3>最终总成绩</h3><ul style='list-style:none; padding:0;'>";
        // Sort by score
        const sortedPlayers = [...state.players].sort((a, b) => b.score - a.score);
        
        sortedPlayers.forEach((p, index) => {
            const color = index === 0 ? '#ffd700' : (p.score >= 0 ? '#ff4d4d' : '#4facfe');
            html += `<li style="font-size:24px; margin:10px 0;">
                ${index === 0 ? '👑 ' : ''}${p.name}: <span style="color:${color}; font-weight:bold;">${p.score}</span>
            </li>`;
        });
        html += "</ul>";
        return html;
    }

    function startNextRound() {
        document.getElementById('message-area').style.display = 'none';
        hideInteractionButtons();
        
        // 1. 更新局数
        state.currentRound++;
        
        // 2. 轮换庄家
        const oldDealerId = state.dealerId;
        if (typeof state.nextDealerId !== 'undefined') {
            // Prism 2: 天选庄家 - 强制连庄一次
            if (state.nextDealerId !== oldDealerId) {
                const oldDealer = state.players[oldDealerId];
                // Prism 2: 天选庄家 (当庄局数翻倍)
                // Removed
            }

            if (state.nextDealerId === state.dealerId) {
                 state.dealerStreak = (state.dealerStreak || 0) + 1;
            } else {
                 state.dealerStreak = 0;
            }

            state.dealerId = state.nextDealerId;
            state.nextDealerId = undefined;
        } else {
            // 默认轮换
            state.dealerStreak = 0;
            state.dealerId = (state.dealerId + 1) % 4;
        }
        
        // 3. 重置局内状态
        state.gameOver = false;
        state.actionProcessing = false; // Reset action lock
        state.pendingDiscards = []; // Clear pending discards
        state.deck = [];
        state.roundGangScores = [];
        state.selectedTileIndex = -1;
        state.lastDiscard = null;
        state.isTingMode = false;
        state.tingCandidates = {};
        state.isGangKai = false;
        state.turnCount = 0;
        state.isGangKaiDiscard = false;
        
        // 4. 重置玩家手牌等 (保留分数)
        state.players.forEach(p => {
            p.hand = [];
            p.discards = [];
            p.peng = [];
            p.gang = [];
            p.isTing = false;
            p.silver3Used = false; // Reset Silver 3 usage
            p.goldNew5Used = false; // Reset Gold New 5 usage (Resource Recycle)
            p.prism9Terminated = false; // Reset Prism 9 contract
            p.anJianUsedTiles = []; // Reset Prism 3 used tiles
            p.systemPaysForMe = false; // Reset Gold 7 flag
            p.immuneToPayment = false;
            p.hextechUsage = {}; // Reset usage counts (like Silver 2)
            // p.prism7Usage = 0; // Removed Prism 7
            // p.prism2Used = false; // Removed Prism 2
        });
        
        // 5. 重新开始流程
        createDeck();
        shuffleDeck();
        dealInitialHands();
        
        // 庄家先摸
        state.currentPlayerIndex = state.dealerId;
        
        // Check Round 8 Hextech
        if (state.currentRound === 8) {
             render();
             renderPlayerHextechs();
             startHextechSelection();
        } else {
             startGameFlow();
        }
    }

    // --- UI 渲染辅助函数 ---

    function getTileVisual(tile) {
        if (!tile) return '';
        var imgName = TILE_IMAGE_MAP[tile];
        if (imgName) {
            var base;
            if (window.location && window.location.protocol === 'file:') {
                base = './';
            } else {
                var p = (window.location && window.location.pathname) || '';
                var i = p.lastIndexOf('/');
                base = i >= 0 ? p.slice(0, i + 1) : '/';
            }
            return '<div class="tile-content"><img src="' + base + 'tiles/' + imgName + '.png" alt="' + tile + '"></div>';
        }
        const suit = tile.slice(-1);
        const numStr = tile.slice(0, -1);
        const numMap = {'一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9};
        const num = numMap[numStr];
        
        let content = '';
        
        if (suit === '筒') {
            content = renderDots(num);
        } else if (suit === '条') {
            content = renderBamboo(num);
        } else if (suit === '万') {
            content = renderWan(numStr);
        } else {
            // 风牌和箭牌
            content = renderHonors(tile);
        }
        
        return `<div class="tile-content">${content}</div>`;
    }

    function renderDots(num) {
        let dotsHtml = '';
        const positions = {
            1: [['50%', '50%', '36px', 'red']],
            2: [['50%', '25%', '14px', 'green'], ['50%', '75%', '14px', 'blue']],
            3: [['25%', '25%', '14px', 'blue'], ['50%', '50%', '14px', 'red'], ['75%', '75%', '14px', 'green']],
            4: [['25%', '25%', '14px', 'blue'], ['75%', '25%', '14px', 'green'], ['25%', '75%', '14px', 'green'], ['75%', '75%', '14px', 'blue']],
            5: [['25%', '25%', '12px', 'blue'], ['75%', '25%', '12px', 'green'], ['50%', '50%', '12px', 'red'], ['25%', '75%', '12px', 'green'], ['75%', '75%', '12px', 'blue']],
            6: [['25%', '25%', '12px', 'green'], ['75%', '25%', '12px', 'green'], ['25%', '50%', '12px', 'red'], ['75%', '50%', '12px', 'red'], ['25%', '75%', '12px', 'red'], ['75%', '75%', '12px', 'red']],
            7: [['25%', '20%', '10px', 'green'], ['50%', '25%', '10px', 'green'], ['75%', '30%', '10px', 'green'], ['25%', '60%', '10px', 'red'], ['75%', '60%', '10px', 'red'], ['25%', '80%', '10px', 'red'], ['75%', '80%', '10px', 'red']],
            8: [['25%', '20%', '10px', 'blue'], ['75%', '20%', '10px', 'blue'], ['25%', '40%', '10px', 'blue'], ['75%', '40%', '10px', 'blue'], ['25%', '60%', '10px', 'blue'], ['75%', '60%', '10px', 'blue'], ['25%', '80%', '10px', 'blue'], ['75%', '80%', '10px', 'blue']],
            9: [['25%', '20%', '10px', 'green'], ['50%', '20%', '10px', 'green'], ['75%', '20%', '10px', 'green'], ['25%', '50%', '10px', 'red'], ['50%', '50%', '10px', 'red'], ['75%', '50%', '10px', 'red'], ['25%', '80%', '10px', 'blue'], ['50%', '80%', '10px', 'blue'], ['75%', '80%', '10px', 'blue']]
        };

        if (positions[num]) {
            positions[num].forEach(([left, top, size, color]) => {
                dotsHtml += `<div class="dot color-${color}" style="position:absolute; left:${left}; top:${top}; width:${size}; height:${size}; transform: translate(-50%, -50%);"></div>`;
            });
        }
        return `<div style="position:relative; width:100%; height:100%;">${dotsHtml}</div>`;
    }

    function renderBamboo(num) {
        if (num === 1) {
            // Bird (Yaoji) shape - Peacock style
            return `<svg viewBox="0 0 100 100" width="100%" height="100%">
                <!-- Tail (Peacock fan) -->
                <path d="M20 50 Q50 10 80 50" fill="none" stroke="#008000" stroke-width="2" />
                <path d="M50 50 L50 20" stroke="#008000" stroke-width="2" />
                <path d="M50 50 L30 25" stroke="#008000" stroke-width="2" />
                <path d="M50 50 L70 25" stroke="#008000" stroke-width="2" />
                <circle cx="50" cy="20" r="3" fill="#d00" />
                <circle cx="30" cy="25" r="3" fill="#d00" />
                <circle cx="70" cy="25" r="3" fill="#d00" />
                
                <!-- Body -->
                <path d="M40 50 Q50 40 60 50 Q70 70 50 80 Q30 70 40 50" fill="#008000" />
                
                <!-- Wing -->
                <path d="M45 55 Q55 55 55 65" fill="none" stroke="#FFD700" stroke-width="2" />

                <!-- Head -->
                <circle cx="50" cy="45" r="8" fill="#d00" />
                <circle cx="47" cy="43" r="1.5" fill="white" />
                
                <!-- Beak -->
                <path d="M42 45 L35 48" stroke="#FFD700" stroke-width="2" />
                
                <!-- Legs -->
                <path d="M45 80 L45 90" stroke="#FFD700" stroke-width="2" />
                <path d="M55 80 L55 90" stroke="#FFD700" stroke-width="2" />
            </svg>`;
        }
        
        let sticksHtml = '';
        // Simplified stick layouts
        const layouts = {
            2: [['50%','30%'], ['50%','70%']],
            3: [['50%','20%'], ['30%','70%'], ['70%','70%']], // One top, two bottom
            4: [['30%','30%'], ['70%','30%'], ['30%','70%'], ['70%','70%']],
            5: [['30%','25%'], ['70%','25%'], ['50%','50%'], ['30%','75%'], ['70%','75%']],
            6: [['30%','25%'], ['50%','25%'], ['70%','25%'], ['30%','75%'], ['50%','75%'], ['70%','75%']], // 3 top 3 bottom
            7: [['50%','20%','red'], ['30%','50%','green'], ['50%','50%','green'], ['70%','50%','green'], ['30%','80%','green'], ['50%','80%','green'], ['70%','80%','green']],
            8: [['30%','20%'], ['70%','20%'], ['30%','40%'], ['70%','40%'], ['30%','60%'], ['70%','60%'], ['30%','80%'], ['70%','80%']], // W shape ish
            9: [['30%','25%','red'], ['50%','25%','red'], ['70%','25%','red'], ['30%','50%','blue'], ['50%','50%','blue'], ['70%','50%','blue'], ['30%','75%','green'], ['50%','75%','green'], ['70%','75%','green']]
        };

        const config = layouts[num];
        if (config) {
            config.forEach(item => {
                const [left, top, colorOverride] = item;
                const color = colorOverride || 'green';
                sticksHtml += `<div class="bamboo-stick color-${color}" style="position:absolute; left:${left}; top:${top}; height:20%; transform: translate(-50%, -50%);"></div>`;
            });
        }
        return `<div style="position:relative; width:100%; height:100%;">${sticksHtml}</div>`;
    }

    function renderWan(numStr) {
        return `<div style="display:flex; flex-direction:column; justify-content:space-between; height:100%; padding:2px 0;">
            <div class="char-wan color-red" style="font-size:32px;">${numStr}</div>
            <div class="char-wan color-red" style="font-size:26px;">万</div>
        </div>`;
    }

    function renderHonors(tile) {
        let displayChar = tile;
        let color = 'black';
        
        if (tile === '中') {
            color = 'red';
        } else if (tile === '发财') {
            color = 'green';
            displayChar = '发';
        } else if (tile === '白板') {
            color = 'blue';
        } else if (tile.endsWith('风')) {
             displayChar = tile[0]; // 只显示'东'/'南'等
             color = 'black';
        }
        
        // Special render for white dragon (frame)
        if (tile === '白板') {
            return `<div style="width:80%; height:80%; border:3px solid #00d; border-radius:4px;"></div>`;
        }
        
        return `<div class="char-honor color-${color}">${displayChar}</div>`;
    }

    // --- 初始化 ---
    // 绑定按钮事件
    document.getElementById('btn-discard').onclick = onDiscardBtnClick;
    document.getElementById('btn-hu').onclick = onHuClick;
    document.getElementById('btn-peng').onclick = onPengClick;
    document.getElementById('btn-gang').onclick = onGangClick;
    document.getElementById('btn-pass').onclick = onPassClick;
    document.getElementById('btn-cancel-takeover').onclick = function () {
        if (!currentRoomName || !state.isTakeover) return;
        socket.emit('action', { roomName: currentRoomName, type: 'cancelTakeover', data: {} });
    };

    // 预加载语音列表 (尝试解决某些浏览器第一次获取不到的问题)
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
    }

    const startBtn = document.getElementById('btn-start-game');
    const createBtn = document.getElementById('btn-create-room');

    function requestFullscreenForMobile() {
        if (window.innerWidth > 1024) return;
        var el = document.documentElement;
        try {
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (el.webkitEnterFullscreen) el.webkitEnterFullscreen();
            else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
            else if (el.msRequestFullscreen) el.msRequestFullscreen();
        } catch (e) {}
    }

    function joinRoom(isCreate) {
        if (hasJoinedRoom) {
            var statusEl = document.getElementById('login-status');
            if (statusEl) {
                statusEl.textContent = '你已经在房间中，如需重新加入请刷新页面。';
            }
            return;
        }

        requestFullscreenForMobile();

        if (startBtn && startBtn.getAttribute('data-clicked') !== 'true') {
            startBtn.setAttribute('data-clicked', 'true');
            unlockAudio(); // 本标签页点击「加入/创建」时解锁语音与音效
        }

        var nameInput = document.getElementById('input-player-name');
        var roomInput = document.getElementById('input-room-name');
        
        // Save name to localStorage
        if (nameInput && nameInput.value.trim()) {
            localStorage.setItem('mahjong_player_name', nameInput.value.trim());
        }
        
        localPlayerName = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '玩家';

        if (isCreate) {
            var autoRoom = '' + Math.floor(Math.random() * 9000 + 1000);
            currentRoomName = autoRoom;
            if (roomInput) {
                roomInput.value = autoRoom;
            }
        } else {
            currentRoomName = roomInput && roomInput.value.trim() ? roomInput.value.trim() : '1001';
        }

        var statusEl = document.getElementById('login-status');
        if (statusEl) {
            if (isCreate) {
                statusEl.textContent = '已创建房间 ' + currentRoomName + '，等待其他玩家加入...';
            } else {
                statusEl.textContent = '正在加入房间 ' + currentRoomName + '...';
            }
        }

        // 重连：服务端优先用 playerId 匹配离线位，若无则用相同用户名匹配（同一房间+同一用户名即可重连）
        var savedPlayerId = sessionStorage.getItem('majiang_player_id') || null;
        socket.emit('join', {
            roomName: currentRoomName,
            playerName: localPlayerName,
            playerId: savedPlayerId
        });
    }

    if (startBtn) {
        startBtn.onclick = function() {
            joinRoom(false);
        };
    }

    if (createBtn) {
        createBtn.onclick = function() {
            joinRoom(true);
        };
    }

    // --- Init: Load saved name ---
    (function() {
        var savedName = localStorage.getItem('mahjong_player_name');
        var nameInput = document.getElementById('input-player-name');
        if (savedName && nameInput) {
            nameInput.value = savedName;
        }
    })();

</script>
