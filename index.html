<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>海克斯麻将</title>
    <style>
        :root {
            --bg-color: #006400;
            --table-texture: repeating-linear-gradient(45deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 4px);
            --tile-w: 48px;
            --tile-h: 66px;
            --tile-depth: 4px;
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: var(--table-texture);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-viewport {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        #game-container {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            perspective: 1000px;
        }

        /* Players Layout */
        .player-area {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let clicks pass through to controls if needed */
        }
        
        .player-area .hand {
            pointer-events: auto;
        }

        /* 状态栏整体 2 倍，无黑底 */
        .info {
            background: transparent;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 28px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            z-index: 10;
            pointer-events: auto;
        }
        .info .player-name { font-size: 28px; }
        .info .score-display { font-size: 28px; }
        .info .dealer-badge { font-size: 24px !important; padding: 0 8px !important; margin: 0 10px !important; }
        .info .status-container { font-size: 24px !important; gap: 16px !important; margin-top: 10px !important; }

        #top-player { top: 20px; left: 0; right: 0; flex-direction: column; }
        #top-player .hand { flex-direction: row; gap: 4px; }
        /* 他人手牌：面积 0.7 倍，尺寸与间隔不重叠、挨着排 */
        #top-player .hand .tile { width: calc(48px * 0.837); height: calc(66px * 0.837); min-width: calc(48px * 0.837); min-height: calc(66px * 0.837); margin: 0; }
        
        #left-player { top: 0; bottom: 0; left: 20px; flex-direction: row; }
        #left-player .hand { flex-direction: column; gap: 4px; }
        
        #right-player { top: 0; bottom: 0; right: 20px; flex-direction: row-reverse; }
        #right-player .hand { flex-direction: column; gap: 4px; }
        
        #bottom-player { bottom: 20px; left: 0; right: 0; flex-direction: column; justify-content: flex-end; }
        /* 自己手牌：明显放大（面积约两倍），直接设宽高确保生效 */
        #bottom-player .hand { margin-bottom: 20px; flex-direction: row; gap: 4px; --tile-w: calc(48px * 1.414); --tile-h: calc(66px * 1.414); }
        #bottom-player .hand .tile { width: calc(48px * 1.414); height: calc(66px * 1.414); min-width: calc(48px * 1.414); min-height: calc(66px * 1.414); }

        /* Center Area (Discards) */
        #center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Discard Zones General */
        .discard-zone {
            pointer-events: auto;
            display: flex;
            align-content: flex-start;
            gap: 0;
            padding: 5px;
        }
        
        /* Wrapper for side players to handle rotation space */
        .discard-wrapper {
            position: relative;
            width: 140px;
            height: 360px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 40px; /* Consistent distance from hand */
        }

        /* Top (Player 2) */
        #discard-2 { 
            flex-direction: row-reverse;
            flex-wrap: wrap-reverse;
            justify-content: center;
            transform: rotate(180deg);
            width: 360px;
            margin-top: 40px; /* Distance from hand */
        }
        
        /* Left (Player 3) */
        #discard-3 { 
            flex-direction: row-reverse;
            flex-wrap: wrap-reverse;
            justify-content: center;
            align-content: center;
            transform: rotate(90deg);
            width: 360px;
            height: 140px;
            position: absolute;
        }
        
        /* Right (Player 1) */
        #discard-1 { 
            flex-direction: row-reverse;
            flex-wrap: wrap-reverse;
            justify-content: center;
            align-content: center;
            transform: rotate(-90deg);
            width: 360px;
            height: 140px;
            position: absolute;
        }
        
        /* Bottom (Player 0) */
        #discard-0 { 
            flex-direction: row; 
            flex-wrap: wrap; 
            justify-content: center; 
            width: 360px;
            margin-bottom: 40px; /* Distance from hand */
        }
        
        .discard-zone .tile {
            transform: scale(0.7); /* Smaller tiles */
            margin: -9px -7px; /* Negative margin to remove gaps caused by scaling */
        }

        /* Tile Styling */
        .tile {
            width: var(--tile-w);
            height: var(--tile-h);
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border-radius: 6px;
            box-shadow: 
                1px 1px 0 #ccc,
                2px 2px 0 #ccc,
                3px 3px 0 #ccc,
                4px 4px 4px rgba(0,0,0,0.3);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            user-select: none;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .tile:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .tile.selected {
            transform: translateY(-15px);
            box-shadow: 
                1px 16px 0 #ccc,
                2px 17px 0 #ccc,
                3px 18px 0 #ccc,
                4px 20px 10px rgba(0,0,0,0.4);
            border: 1px solid #87ceeb;
            z-index: 100;
        }
        
        .tile.ting-candidate {
            box-shadow: 0 0 0 2px gold, 4px 4px 4px rgba(0,0,0,0.3);
            z-index: 50;
        }

        .tile-face-down {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            border: 1px solid #2980b9;
        }
        .tile-face-down::after {
            content: '';
            position: absolute;
            top: 4px; bottom: 4px; left: 4px; right: 4px;
            border: 1px dashed rgba(255,255,255,0.3);
            border-radius: 4px;
        }

        /* Tile Content Graphics */
        .tile-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2px;
            box-sizing: border-box;
        }

        /* Dot (Circle) Styles */
        .dot { border-radius: 50%; box-shadow: inset -1px -1px 2px rgba(0,0,0,0.2); }
        .dot-container { display: flex; flex-wrap: wrap; justify-content: space-around; align-content: space-around; width: 100%; height: 100%; padding: 4px; }
        
        /* Bamboo Styles */
        .bamboo-stick { width: 4px; border-radius: 2px; position: relative; }
        .bamboo-bird { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; }
        
        /* Character Styles */
        .char-wan { font-family: 'KaiTi', 'STKaiti', serif; line-height: 1; font-weight: 900; }
        .char-honor { font-family: 'KaiTi', 'STKaiti', serif; font-size: 36px; line-height: 1; }

        /* Colors */
        .color-red { color: #d00; fill: #d00; background-color: #d00; }
        .color-green { color: #008000; fill: #008000; background-color: #008000; }
        .color-blue { color: #00f; fill: #00f; background-color: #00f; }
        .color-black { color: #000; fill: #000; background-color: #000; }

        /* Hand Layouts */
        .hand {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            min-height: 80px;
        }

        #left-player .hand, #right-player .hand {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 50px;
        }
        
        /* 左右他人手牌：面积 0.7 倍，间隔 4px 不重叠 */
        #left-player .hand .tile, #right-player .hand .tile {
            width: calc(48px * 0.837);
            height: calc(66px * 0.837);
            min-width: calc(48px * 0.837);
            min-height: calc(66px * 0.837);
            margin: 0;
        }
        
        /* Controls */
        #controls {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 200;
            pointer-events: none; /* Container passes clicks */
        }
        
        #controls button {
            pointer-events: auto;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            border: 4px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        
        #btn-peng { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        #btn-gang { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; }
        #btn-hu { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); color: white; font-size: 24px; width: 70px; height: 70px; }
        #btn-ting { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: white; }
        #btn-discard { background: #fff; color: #333; display: none; } /* Hide standard discard button, use interactions */
        #btn-pass { background: #ccc; color: #666; font-size: 14px; width: 40px; height: 40px; }

        button:hover { transform: scale(1.1); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        button:active { transform: scale(0.95); }

        /* Animations */
        @keyframes draw-anim {
            0% { transform: translateY(-20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .anim-draw { animation: draw-anim 0.3s ease-out; }

        /* Tile Internal Visuals */
        .tile-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .tile-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #f0e6d8;
        }
        
        .color-red { color: #d00; background-color: #d00; border-color: #d00; }
        .color-green { color: #080; background-color: #080; border-color: #080; }
        .color-blue { color: #00d; background-color: #00d; border-color: #00d; }
        .color-black { color: #000; background-color: #000; border-color: #000; }
        
        /* Text overrides for background-color usage (dots/sticks use bg, text uses color) */
        .char-wan, .char-honor { background-color: transparent !important; }

        .dot {
            border-radius: 50%;
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.3), inset 1px 1px 2px rgba(255,255,255,0.5);
        }

        .bamboo-stick {
            width: 6px; /* default width */
            border-radius: 4px;
            box-shadow: inset -1px 0 1px rgba(0,0,0,0.3);
        }

        .char-wan {
            font-family: "KaiTi", "楷体", "STKaiti", serif;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .char-honor {
            font-family: "KaiTi", "楷体", "STKaiti", serif;
            font-weight: 900;
            font-size: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hextech Modal Styles */
        #hextech-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .hextech-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .hextech-card {
            width: 220px;
            height: 300px;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            background: #2a2a2a;
            border: 2px solid #555;
            color: #eee;
        }
        
        .hextech-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        .hextech-card.silver { 
            border-color: #e0e0e0; 
            box-shadow: 0 0 15px rgba(224, 224, 224, 0.4); 
            background: linear-gradient(135deg, #444 0%, #777 50%, #444 100%);
            color: #fff;
        }
        .hextech-card.gold { 
            border-color: #ffd700; 
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); 
            background: linear-gradient(135deg, #554400 0%, #997700 50%, #554400 100%);
            color: #fff;
        }
        .hextech-card.prismatic { 
            border-color: #00ffff; 
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6); 
            background: linear-gradient(135deg, #2c3e50 0%, #4a148c 50%, #b71c1c 100%);
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        .hextech-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3); /* Transparent dark to blend with gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .hextech-name { font-size: 20px; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 2px rgba(0,0,0,0.5); }
        .hextech-desc { font-size: 14px; line-height: 1.4; color: #eee; text-shadow: 0 1px 1px rgba(0,0,0,0.5); }
        
        /* Player Hextech Icons（状态栏内 2 倍） */
        .player-hextechs {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
        .mini-hextech {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: help;
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        .mini-hextech.silver { background: linear-gradient(135deg, #e0e0e0, #7f8c8d); }
        .mini-hextech.gold { background: linear-gradient(135deg, #f1c40f, #d35400); }
        .mini-hextech.prismatic { background: linear-gradient(135deg, #8e44ad, #c0392b, #f39c12); }

        /* Start Screen Styles */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,64,0,0.95); /* Dark Green overlay */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            backdrop-filter: blur(5px);
        }
        #btn-start-game {
            padding: 20px 60px;
            font-size: 28px;
            background: linear-gradient(135deg, #ffd700 0%, #fdb931 100%); /* Gold button */
            border: 4px solid #fff;
            border-radius: 50px;
            color: #8b4500;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            animation: pulse-btn 2s infinite;
        }
        #btn-start-game:active { transform: scale(0.95); }
        
        @keyframes pulse-btn {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        @keyframes rotate-phone {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(90deg); }
            50% { transform: rotate(90deg); }
            75% { transform: rotate(0deg); }
            100% { transform: rotate(0deg); }
        }

        /* 剩余牌数、局数、房间号：2 倍字号，无黑底，剩余与局数间隔加大 */
        #deck-info {
            font-size: 36px !important;
            font-weight: bold;
            padding: 16px 24px !important;
            background: transparent !important;
            border: none !important;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        #round-info {
            font-size: 40px !important;
            font-weight: bold;
            padding: 10px 20px !important;
            background: transparent !important;
            color: #ffd700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        #room-id-display {
            font-size: 32px !important;
            padding: 10px 20px !important;
            background: transparent !important;
            color: #ffd700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        /* --- 桌面端：round-info / deck-info 位置，间隔加大避免重叠 --- */
        @media screen and (min-width: 1025px) {
            #deck-info { top: 20px; left: 20px; }
            #round-info {
                position: absolute;
                top: 110px;
                left: 20px;
                transform: none;
                z-index: 5;
            }
        }

        /* --- 移动端：等比例缩放 + 全屏自适应（与电脑端同布局，整体缩放填满屏幕）--- */
        @media screen and (max-width: 1024px) {
            body { overflow: hidden; }
            #game-viewport {
                position: fixed;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                background: var(--bg-color);
            }
            #game-viewport #start-screen,
            #game-viewport #game-container {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 1400px;
                height: 900px;
                margin-left: -700px;
                margin-top: -450px;
                transform: scale(var(--game-scale, 1));
                transform-origin: center center;
            }
            #game-viewport #game-container { position: absolute; }
            #game-viewport #start-screen {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
        }

        /* --- 移动端竖屏时：强制横屏游玩（整页旋转 90° 显示）--- */
        @media screen and (max-width: 1024px) and (orientation: portrait) {
            #game-viewport {
                width: 100vh;
                height: 100vw;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center center;
            }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="game-viewport">
<div id="start-screen">
    <div style="font-size: 48px; margin-bottom: 20px; font-weight:bold; text-shadow: 0 5px 10px rgba(0,0,0,0.5);">🀄 海克斯麻将</div>
    <div style="margin-bottom: 30px; font-size: 16px; color: #eee; text-align:center; max-width: 80%;">
        请输入玩家昵称和房间号，然后点击下方按钮加入游戏<br>
        <span style="font-size:14px; opacity:0.8;">首次点击会启用音效与语音</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:12px; width:260px; max-width:80%;">
        <input id="input-player-name" type="text" placeholder="玩家昵称" maxlength="12"
               style="padding:10px 14px; border-radius:6px; border:1px solid rgba(255,255,255,0.4); outline:none; font-size:16px; text-align:center; background:rgba(0,0,0,0.35); color:#fff;">
        <input id="input-room-name" type="text" placeholder="房间号 (4位数字)" maxlength="4"
               style="padding:10px 14px; border-radius:6px; border:1px solid rgba(255,255,255,0.4); outline:none; font-size:16px; text-align:center; background:rgba(0,0,0,0.35); color:#fff;">
    </div>
    <button id="btn-create-room" style="margin-top:26px;">创建房间</button>
    <button id="btn-start-game" style="margin-top:10px;">加入房间</button>
    <div id="login-status" style="margin-top:14px; font-size:14px; color:#ffd700;"></div>
</div>

<div id="game-container">
    <div id="top-player" class="player-area">
        <div class="info" id="info-2">
            <span class="player-name">电脑 (上)</span> <span class="dealer-badge" id="dealer-badge-2" style="display:none; color:#ff4d4d; border:1px solid #ff4d4d; border-radius:3px; padding:0 4px; margin:0 5px; font-size:12px;">庄</span> <span class="score-display" style="color:#ffd700; font-weight:bold;">0</span>
            <div class="player-hextechs" id="hextechs-2"></div>
        </div>
        <div class="hand" id="hand-2"></div>
        <div class="discard-zone" id="discard-2"></div> <!-- Top Discards -->
    </div>
    
    <div id="left-player" class="player-area">
        <div class="info" id="info-3" style="writing-mode: vertical-rl; display:flex; align-items:center;">
            <div><span class="player-name">电脑 (左)</span> <span class="dealer-badge" id="dealer-badge-3" style="display:none; color:#ff4d4d; border:1px solid #ff4d4d; border-radius:3px; padding:0 4px; margin:0 5px; font-size:12px;">庄</span> <span class="score-display" style="color:#ffd700; font-weight:bold;">0</span></div>
            <div class="player-hextechs" id="hextechs-3" style="flex-direction:column; margin-top:5px;"></div>
        </div>
        <div class="hand" id="hand-3"></div>
        <div class="discard-wrapper">
            <div class="discard-zone" id="discard-3"></div> <!-- Left Discards -->
        </div>
    </div>

            var w = window.innerWidth, h = window.innerHeight;

            if (w <= 1024) {
                if (h > w) {
                    scale = Math.min(h / DESIGN_W, w / DESIGN_H);
                } else {
                    scale = Math.min(w / DESIGN_W, h / DESIGN_H);
                }
            }
            document.documentElement.style.setProperty('--game-scale', String(scale));

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateGameScale);
        } else {
            updateGameScale();

        const btnPass = document.getElementById('btn-pass');
        const actionTimerEl = document.getElementById('action-timer');
        const centerTimerEl = document.getElementById('timer-display');
        
        // Hide all first
        btnHu.style.display = 'none';
        btnPeng.style.display = 'none';
        btnGang.style.display = 'none';
        btnPass.style.display = 'none';
        actionTimerEl.style.display = 'none';
        
        // Clear existing action timer (碰/杠/胡 8s)
        if (state.actionTimerId) {
            clearInterval(state.actionTimerId);
            state.actionTimerId = null;
        }

        if (!actions || actions.length === 0) return;

        var me = state.players[0];
        var myHand = Array.isArray(me && me.hand) ? me.hand : [];
        var myPeng = Array.isArray(me && me.peng) ? me.peng : [];
        function handCount(t) { return myHand.filter(function(x){ return x === t; }).length; }

        actions.forEach(action => {
            if (action.type === 'hu') {
                btnHu.style.display = 'flex';
                btnHu.onclick = onHuClick;
            }
            if (action.type === 'peng') {
                btnPeng.style.display = 'flex';
                btnPeng.onclick = onPengClick;
            }
            if (action.type === 'gang') {
                var canShowGang = true;
                if (action.data) {
                    if (action.data.type === 'ming') {
                        canShowGang = tile && handCount(tile) >= 3;
                    } else if (action.data.type === 'an') {
                        canShowGang = action.data.tile && handCount(action.data.tile) >= 4;
                    } else if (action.data.type === 'added') {
                        canShowGang = action.data.tile && myPeng.indexOf(action.data.tile) !== -1 && myHand.indexOf(action.data.tile) !== -1;
                    }
                }
                if (canShowGang) {
                    btnGang.style.display = 'flex';
                    btnGang.onclick = onGangClick;
                }
            }
        });

        if (actions.length > 0) {
            btnPass.style.display = 'flex';
            btnPass.onclick = onPassClick;
            
            // 碰/杠/胡 8s 倒计时：与出牌 20s 同一效果，用中间 timer-display 显示
            if (timeout && timeout > 0) {
                var seconds = Math.floor(timeout / 1000);
                actionTimerEl.style.display = 'block';
                actionTimerEl.textContent = seconds + 's';
                if (centerTimerEl) {
                    centerTimerEl.style.display = 'flex';
                    centerTimerEl.textContent = seconds;
                    if (seconds <= 5) {
                        centerTimerEl.style.color = '#ff4d4d';
                        centerTimerEl.style.borderColor = '#ff4d4d';
                    } else {
                        centerTimerEl.style.color = '#fff';
                        centerTimerEl.style.borderColor = '#fff';
                    }
                }
                state.actionTimerId = setInterval(function() {
                    seconds--;
                    if (seconds <= 0) {
                        if (state.actionTimerId) {
                            clearInterval(state.actionTimerId);
                            state.actionTimerId = null;
                        }
                        actionTimerEl.textContent = '0s';
                        if (centerTimerEl) {
                            centerTimerEl.textContent = '0';
                            centerTimerEl.style.color = '#ff4d4d';
                        }
                        hideInteractionButtons();
                    } else {
                        actionTimerEl.textContent = seconds + 's';
                        if (centerTimerEl) {
                            centerTimerEl.textContent = seconds;
                            if (seconds <= 5) {
                                centerTimerEl.style.color = '#ff4d4d';
                                centerTimerEl.style.borderColor = '#ff4d4d';
                            } else {
                                centerTimerEl.style.color = '#fff';
                                centerTimerEl.style.borderColor = '#fff';
                            }
                        }
                    }
                }, 1000);
            }
        }
    }

    function hideInteractionButtons() {
        document.getElementById('btn-hu').style.display = 'none';
        document.getElementById('btn-peng').style.display = 'none';
        document.getElementById('btn-gang').style.display = 'none';
        document.getElementById('btn-pass').style.display = 'none';
        document.getElementById('action-timer').style.display = 'none';
        state.pendingServerActions = null;
        var centerTimerEl = document.getElementById('timer-display');
        if (centerTimerEl) {
            centerTimerEl.textContent = '';
            centerTimerEl.style.display = 'none';
        }
        if (state.actionTimerId) {
            clearInterval(state.actionTimerId);
            state.actionTimerId = null;
        }
    }

    function sortHand(hand) {
        if (!hand) return [];
        hand.sort((a, b) => getTileWeight(a) - getTileWeight(b));
    }


    // Helper to map server player ID to local view index (0=Bottom/Me, 1=Right, 2=Top, 3=Left)
    // --- 辅助函数 ---
    function pHasHex(player, hexId) {
        if (!player || !player.hextechs) return false;
        return player.hextechs.some(h => (typeof h === 'string' ? h === hexId : h.id === hexId));
    }

    function getServerToLocalIndex(serverIndex) {
        if (typeof state.myServerId === 'undefined') return serverIndex;
        return (serverIndex - state.myServerId + 4) % 4;
    }

    socket.on('gameStart', function (data) {
        currentRoomName = data.roomName;
        hasJoinedRoom = true; // 成功进入对局
        state.myServerId = data.myId; // Store my server ID (0-3)
        state.isTakeover = false;
        if (data.playerId || (data.self && data.self.playerId)) {
            var pid = String(data.playerId || data.self.playerId || '');
            if (pid) {
                localStorage.setItem('majiang_player_id', pid);
                sessionStorage.setItem('majiang_player_id', pid);
            }
        }

        var startScreen = document.getElementById('start-screen');
        if (startScreen) {
            startScreen.style.opacity = '0';
            startScreen.style.transition = 'opacity 0.5s';
            setTimeout(function () {
                startScreen.style.display = 'none';
            }, 500);
        }

        state.deck = [];
        for (var i = 0; i < data.deckSize; i++) {
            state.deck.push(null);
        }
        state.currentPlayerIndex = data.currentPlayerIndex;
        state.dealerId = data.dealerId;

        // Reset and map players based on rotation
        data.players.forEach(function (p, serverIdx) {
            var localIdx = getServerToLocalIndex(serverIdx);
            if (state.players[localIdx]) {
                state.players[localIdx].name = p.name;
                state.players[localIdx].score = p.score;
                state.players[localIdx].hand = [];
                state.players[localIdx].hextechs = [];
            }
        });
        // 联机开局时立即更新界面玩家名，避免选海克斯时仍显示“电脑(上)”等
        state.players.forEach(function (p, localIdx) {
            var infoEl = document.getElementById('info-' + localIdx);
            if (infoEl) {
                var nameSpan = infoEl.querySelector('.player-name');
                if (nameSpan) nameSpan.textContent = (localIdx === 0 ? p.name + ' (你)' : p.name);
            }
        });
        state.roundNum = (data.roundNum != null ? data.roundNum : 1); // 第1/6/11局选海克斯时服务端会带 roundNum

        var roomIdEl = document.getElementById('room-id-display');
        if (roomIdEl && currentRoomName) {
            roomIdEl.style.display = 'block';
            roomIdEl.textContent = '房间号: ' + currentRoomName;
        }

        if (data.self && data.self.hand) {
            state.players[0].hand = data.self.hand.slice();
        }

        if (data.self && Array.isArray(data.self.hextechOptions) && data.self.hextechOptions.length > 0) {
            const mapped = normalizeHextechOptions(data.self.hextechOptions);
            if (mapped.length > 0) {
                console.log('gameStart hextechOptions raw:', data.self.hextechOptions);
                console.log('gameStart hextechOptions mapped:', mapped);
                state.players[0].hextechOptions = mapped;
                state.hextechSelectionPending = true;
                renderHextechSelectionModal();
                startHextechTimer();
            }
        }

        render();
        if (typeof renderPlayerHextechs === 'function') {
            renderPlayerHextechs();
        }
        updateTakeoverButton();
    });

    socket.on('hexOptions', function(payload) {
        const raw = payload && Array.isArray(payload.options) ? payload.options : [];
        const mapped = normalizeHextechOptions(raw);
        console.log('hexOptions payload:', payload);
        console.log('hexOptions mapped:', mapped);
        if (mapped.length === 0) return;
        state.players[0].hextechOptions = mapped;
        state.hextechSelectionPending = true;
        renderHextechSelectionModal();
        startHextechTimer();
    });

    socket.on('updateState', function (data) {
        if (!data || !Array.isArray(data.players)) return;
        
        // 无待处理动作时先收掉胡/碰/杠/过和倒计时，避免结算或下一局仍残留
        var myPending = data.pendingActions && data.pendingActions[state.myServerId];
        if (!myPending || (Array.isArray(myPending) && myPending.length === 0)) {
            hideInteractionButtons();
        } else {
            // 有碰/杠/胡时先停掉出牌20s，只显示8s动作倒计时，避免“轮到我碰时已是20s且点碰提示超时”
            stopTurnTimer();
        }
        
        // Reset Game Over state on new state update
        state.gameOver = false;
        
        // Sync global state
        state.dealerId = data.dealerId;
        state.currentPlayerIndex = data.currentPlayerIndex;
        state.deck = data.deck || [];
        state.roundNum = data.roundNum || 1; // 同步当前局数
        
        // 更新局数 UI
        const roundInfoEl = document.getElementById('round-info');
        if (roundInfoEl) {
            roundInfoEl.textContent = `第 ${state.roundNum} / 16 局`;
        }
        
        if (data.deckSize) {
             state.deck = new Array(data.deckSize).fill(null);
        }
        
        if (data.lastDiscard) {
            state.lastDiscard = data.lastDiscard;
        }
        state.currentPlayerDrewThisTurn = !!data.currentPlayerDrewThisTurn;
        state.codeInterferenceActive = !!data.codeInterferenceActive;
        state.confuseMyHand = !!data.confuseMyHand;
        state.waitingForArchmage = data.waitingForArchmage;
        // 大魔法师：与服务器同步选牌状态，避免服务端已超时但客户端仍显示选牌导致提交被拒
        var amWaiting = (data.waitingForArchmage != null && String(data.waitingForArchmage) === String(state.myServerId));
        state.archmageSwapMode = !!amWaiting;
        if (!amWaiting) state.archmageSelectedIndices = [];
        
        if (data.roomName) {
            var roomIdEl = document.getElementById('room-id-display');
            if (roomIdEl) {
                roomIdEl.style.display = 'block';
                roomIdEl.textContent = '房间号: ' + data.roomName;
            }
        }
        
        // Sync players with rotation
        data.players.forEach(function (p, serverIdx) {
            var localIdx = getServerToLocalIndex(serverIdx);
            if (state.players[localIdx]) {
                var cp = state.players[localIdx];
                cp.name = p.name;
                cp.score = p.score;
                if (Array.isArray(p.hextechs)) {
                    cp.hextechs = normalizeHextechOptions(p.hextechs);
                } else {
                    cp.hextechs = [];
                }
                cp.peng = p.peng || [];
                cp.gang = p.gang || [];
                cp.discards = p.discards || [];
                cp.wildcardTile = p.wildcardTile; // Sync wildcard tile
                cp.isTing = !!p.isTing;

                var infoEl = document.getElementById('info-' + localIdx);
                if (infoEl) {
                    var nameSpan = infoEl.querySelector('.player-name');
                    if (nameSpan) {
                        if (localIdx === 0) {
                            nameSpan.textContent = p.name + ' (你)';
                        } else {
                            nameSpan.textContent = p.name;
                        }
                    }
                }
                
                if (localIdx !== 0) {
                    if (Array.isArray(p.hand) && p.hand.length > 0) {
                        // Server sent visible hand (full or partial with nulls)
                        // Use it directly
                        cp.hand = p.hand;
                    } else if (typeof p.handSize === 'number') {
                        // Fallback to hidden (all nulls)
                        cp.hand = new Array(p.handSize).fill(null);
                    }
                }
            }
        });

        if (data.self) {
            let newHand = data.self.hand || [];
            
            // Sync local player flags
            const human = state.players[0];
            human.silver3Used = !!data.self.silver3Used;
            human.goldNew5Used = !!data.self.goldNew5Used;
            state.isTakeover = !!data.self.isTakeover;
            
            // Check for Silver 3 (摸牌入门)：每局轮到自己第一次出牌时（我的回合且手牌14张）触发
            const hasSilver3 = pHasHex(state.players[0], 'silver_3');
            const isMyFirstDiscard = (state.currentPlayerIndex === state.myServerId) && (newHand.length === 14);
            if (hasSilver3 && !human.silver3Used && !state.swapMode && isMyFirstDiscard) {
                showSilver3UI(human);
            }

            // 摸牌/杠后摸牌保持在最右：仅当 14 张且轮到我时把最后一张单独排；13 张时整手排序；14 张非我回合不排序，保留服务端顺序
            if (newHand.length % 3 === 2) {
                if (state.currentPlayerIndex === state.myServerId) {
                    const drawn = newHand.pop();
                    sortHand(newHand);
                    newHand.push(drawn);
                }
            } else if (newHand.length % 3 === 1) {
                sortHand(newHand);
            }
            state.players[0].hand = newHand;

            if (Array.isArray(data.self.hextechOptions)) {
                const mappedSelfHex = normalizeHextechOptions(data.self.hextechOptions);
                if (mappedSelfHex.length > 0) {
                    state.players[0].hextechOptions = mappedSelfHex;
                }
            }
        }
        
        // Re-render
        render();
        if (typeof renderPlayerHextechs === 'function') {
            renderPlayerHextechs();
        }
        updateTakeoverButton();

        // 允许操作 (如果是我的回合，或者有待处理动作)
        const hasPendingAction = data.pendingActions && data.pendingActions[state.myServerId];
        if (state.currentPlayerIndex === state.myServerId || hasPendingAction) {
             state.actionProcessing = false;
        }

        if (hasPendingAction) {
             var myActions = data.pendingActions[state.myServerId];
             state.pendingServerActions = Array.isArray(myActions) ? myActions.slice() : [];
             console.log('Received pending actions from updateState:', state.pendingServerActions);
             showInteractionButtons(myActions, data.lastDiscard && data.lastDiscard.tile ? data.lastDiscard.tile : null, 8000);
        }

        if (state.currentPlayerIndex === state.myServerId) {
             const me = state.players[0];
             const hasDrawnTile = Array.isArray(me.hand) && (me.hand.length % 3 === 2);
             if (hasDrawnTile) {
                 startTurnTimer();
             } else {
                 stopTurnTimer();
             }
             checkActions();
        } else if (!hasPendingAction) {
             stopTurnTimer();
             hideInteractionButtons();
        }
    });

    socket.on('roundEnd', function (data) {
        state.gameOver = true;
        stopTurnTimer();
        hideInteractionButtons();
        // 优先用下一局局数，这样结算后立刻显示“第 2/16 局”，避免第二局仍显示 1/16
        if (data) {
            if (data.nextRoundNum != null) state.roundNum = data.nextRoundNum;
            else if (data.roundNum != null) state.roundNum = data.roundNum;
        }
        var roundInfoEl = document.getElementById('round-info');
        if (roundInfoEl && state.roundNum != null) roundInfoEl.textContent = '第 ' + state.roundNum + ' / 16 局';

        // 立即用服务端下发的积分变动更新本地分数，保证显示一致
        if (data && data.scoreChanges && typeof data.scoreChanges === 'object') {
            for (var pid in data.scoreChanges) {
                var serverId = parseInt(pid, 10);
                if (isNaN(serverId) || serverId < 0 || serverId > 3) continue;
                var localIdx = getServerToLocalIndex(serverId);
                if (state.players[localIdx]) {
                    var delta = Number(data.scoreChanges[pid]);
                    if (!isNaN(delta)) state.players[localIdx].score += delta;
                }
            }
        }

        var title = '';
        var detail = '';
        var summaryHtml = '';

        if (!data || data.winType === 'liuju') {
            title = '流局';
            detail = '本局无人胡牌。';
        } else {
            var winnerName = '';
            var loserName = '';

            if (typeof data.winnerId === 'number') {
                var winnerServerId = data.winnerId;
                var winnerLocalIdx = getServerToLocalIndex(winnerServerId);
                var winner = state.players[winnerLocalIdx];
                winnerName = winner ? winner.name : ('玩家 ' + (winnerServerId + 1));
            }

            if (typeof data.loserId === 'number') {
                var loserServerId = data.loserId;
                var loserLocalIdx = getServerToLocalIndex(loserServerId);
                var loser = state.players[loserLocalIdx];
                loserName = loser ? loser.name : ('玩家 ' + (loserServerId + 1));
            }

            if (data.winType === 'zimo') {
                title = '自摸胡牌';
                detail = winnerName + ' 自摸胡牌。';
            } else if (data.winType === 'dianpao') {
                title = '点炮胡牌';
                detail = winnerName + ' 胡了 ' + loserName + ' 的点炮。';
            } else {
                title = '本局结束';
                detail = winnerName + ' 胜出。';
            }
        }

        // 显示海克斯触发总结
        if (data.summary && data.summary.length > 0) {
            summaryHtml = '<div style="font-size:14px; color:#aaa; margin:15px 0; text-align:left; max-height:150px; overflow-y:auto; padding:10px; background:rgba(0,0,0,0.2); border-radius:5px;">' +
                          data.summary.map(s => '<div>• ' + s + '</div>').join('') +
                          '</div>';
        }

        // 显示积分：第16局结束显示整场总分，否则显示本局积分变化
        var scoresHtml = '<div style="margin-bottom:20px; display:flex; justify-content:space-around;">';
        if (data.isGameOver) {
            state.players.forEach(function(p, localIdx) {
                const total = typeof p.score === 'number' ? p.score : 0;
                const color = total >= 0 ? '#ff4d4d' : '#4dff4d';
                const sign = total < 0 ? '-' : '';
                scoresHtml += `<div style="text-align:center">
                    <div style="font-size:12px; color:#888">${p.name}</div>
                    <div style="font-size:18px; color:${color}; font-weight:bold">${sign}${Math.abs(total)} 分</div>
                </div>`;
            });
        } else if (data.scoreChanges) {
            for (let pid in data.scoreChanges) {
                const change = data.scoreChanges[pid];
                const color = change >= 0 ? '#ff4d4d' : '#4dff4d';
                const sign = change >= 0 ? '+' : '';
                scoresHtml += `<div style="text-align:center">
                    <div style="font-size:12px; color:#888">玩家${parseInt(pid)+1}</div>
                    <div style="font-size:18px; color:${color}; font-weight:bold">${sign}${change}</div>
                </div>`;
            }
        }
        scoresHtml += '</div>';

        var msgEl = document.getElementById('message-area');
        if (msgEl) {
            var buttonHtml = '';
            if (data.isGameOver) {
                buttonHtml = '<button onclick=\"location.reload()\" style=\"padding:10px 30px; font-size:20px; border-radius:30px; background:#4CAF50; color:white; border:none; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.3);\">游戏结束 (返回主页)</button>';
            } else {
                buttonHtml = '<div style=\"font-size:16px; color:#ffd700; margin-top:10px;\">下一局即将开始...</div>';
                // 5秒后自动隐藏
                setTimeout(() => {
                    msgEl.style.display = 'none';
                }, 5000);
            }

            msgEl.innerHTML = ''
                + '<h2 style=\"margin:0 0 10px 0; font-size:32px; color:#ffd700;\">' + (data.isGameOver ? '游戏结束' : title) + '</h2>'
                + '<div style=\"font-size:18px; margin-bottom:15px;\">' + (data.isGameOver ? '整场积分总分如下' : detail) + '</div>'
                + scoresHtml
                + summaryHtml
                + buttonHtml;
            msgEl.style.display = 'block';
        }
    });

    // --- 音效系统 (Audio System) ---
    var _audioUnlocked = false; // 本标签页是否已通过用户手势解锁过音频
    function unlockAudio() {
        if (_audioUnlocked) return;
        _audioUnlocked = true;
        SoundManager.init();
        if ('speechSynthesis' in window) {
            try {
                window.speechSynthesis.cancel();
                var empty = new SpeechSynthesisUtterance('');
                empty.volume = 0.01;
                window.speechSynthesis.speak(empty);
                if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            } catch (e) {}
        }
    }
    // 任意标签页内首次点击/触摸/按键都会解锁本页音频（解决多开时只有部分页面有语音的问题）
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });

    // 牌名 → 男声 MP3 文件后缀：1-9 万，11-19 条，21-29 筒，31-37 东南西北中发白

        '一条': 11, '二条': 12, '三条': 13, '四条': 14, '五条': 15, '六条': 16, '七条': 17, '八条': 18, '九条': 19,

    function preloadTileImages() {
        var base;
        if (window.location && window.location.protocol === 'file:') base = './';
        else {
            var p = (window.location && window.location.pathname) || '';
            var i = p.lastIndexOf('/');
            base = i >= 0 ? p.slice(0, i + 1) : '/';
        }
        var seen = {};
        for (var k in TILE_IMAGE_MAP) {
            var imgName = TILE_IMAGE_MAP[k];
            if (seen[imgName]) continue;
            seen[imgName] = true;
            var img = new Image();
            img.src = base + 'tiles/' + imgName + '.png';
        }
    }
    preloadTileImages();

    const SoundManager = {
        ctx: null,
        init: function() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                this.ctx = new AudioContext();
                
                // 播放一个空音来解锁 iOS/Android 的音频限制
                const buffer = this.ctx.createBuffer(1, 1, 22050);
                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(this.ctx.destination);
                source.start(0);
                
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            } catch (e) {
                console.error('AudioContext init failed:', e);
            }
        },
        playTone: function(freq, type, duration) {
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) {
                // Ignore
            }
        },
        playClick: function() {
            this.playTone(800, 'triangle', 0.1);
        },
        playDiscard: function() {
            // 模拟麻将打出的清脆声音
            this.playTone(1200, 'sine', 0.05);
            setTimeout(() => this.playTone(1000, 'sine', 0.05), 50);
        },
        _maleBase: function() {
            var p = (window.location && window.location.pathname) || '';
            var i = p.lastIndexOf('/');
            return i >= 0 ? p.slice(0, i + 1) : './';
        },

        playTileSound: function(tileName) {
            var id = TILE_SOUND_MAP[tileName];

        },

        playActionSound: function(actionType) {
            var url = this._maleBase() + 'male/sound_man_' + actionType + '.mp3';
            var a = new Audio(url);

    function speak(text, opts) {
        var noCancel = opts && opts.noCancel === true;
        if (SoundManager.ctx && SoundManager.ctx.state === 'suspended') {
            SoundManager.ctx.resume().catch(function() {});
        }
        if ('speechSynthesis' in window) {
            if (!noCancel) window.speechSynthesis.cancel();
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            var msg = new SpeechSynthesisUtterance();
            msg.text = text;
            msg.lang = 'zh-CN';
            msg.rate = 1.3;
            msg.pitch = 1.0;
            var voices = window.speechSynthesis.getVoices();
            var zhVoice = voices.find(function(v) { return v.name.indexOf('Google') !== -1 && v.lang.indexOf('zh') !== -1; }) ||
                         voices.find(function(v) { return v.lang.indexOf('zh') !== -1; });
            if (zhVoice) msg.voice = zhVoice;
            window.speechSynthesis.speak(msg);
        }
    }

    function startTurnTimer() {
        stopTurnTimer(); // 先清除旧的
        state.timeLeft = 20;
        updateTimerDisplay();
        
        state.timerId = setInterval(() => {
            state.timeLeft--;
            updateTimerDisplay();
            
            if (state.timeLeft <= 0) {
                // stopTurnTimer(); // Don't hide the timer immediately on timeout
                if (state.timerId) {
                    clearInterval(state.timerId);
                    state.timerId = null;
                }
                handleTimeout();
            }
        }, 1000);
    }
    
    function stopTurnTimer() {
        if (state.timerId) {
            clearInterval(state.timerId);
            state.timerId = null;
        }
        document.getElementById('timer-display').textContent = '';
        document.getElementById('timer-display').style.display = 'none';
    }

    function updateTakeoverButton() {
        var btn = document.getElementById('btn-cancel-takeover');
        if (!btn) return;
        if (currentRoomName && state.isTakeover && !state.gameOver) {
            btn.style.display = 'inline-block';
        } else {
            btn.style.display = 'none';
        }
    }
    
    function updateTimerDisplay() {
        const timerEl = document.getElementById('timer-display');
        if (timerEl) {
            if (state.timeLeft <= 0) {
                timerEl.textContent = '';
                timerEl.style.display = 'none';
                return;
            }
            timerEl.style.display = 'flex';
            timerEl.textContent = state.timeLeft;
            if (state.timeLeft <= 5) {
                timerEl.style.color = '#ff4d4d';
                timerEl.style.borderColor = '#ff4d4d';
            } else {
                timerEl.style.color = '#fff';
                timerEl.style.borderColor = '#fff';
            }
        }
    }
    
    function handleTimeout() {
        if (state.gameOver) return;
        // 出牌超时：不显示“超时”字样，不本地出牌；由服务端接入 AI 托管并自动出牌，界面通过 updateState 显示“取消托管”按钮
        stopTurnTimer();
    }

    function isSequence(t1, t2, t3) {
        if (!t1 || !t2 || !t3) return false;
        if (t1.slice(-1) !== t2.slice(-1) || t2.slice(-1) !== t3.slice(-1)) return false; // Different suits
        if (['风','中','发财','白板'].some(x => t1.includes(x))) return false; // Honor tiles no seq

    /**
     * 山西推倒胡结算模块
     * @param {string} winType - 'zimo' | 'dianpao' | 'gangkai' | 'liuju'
     * @param {number} winnerId - 胡牌玩家ID
     * @param {number} loserId - 点炮玩家ID (仅点炮有效)
     */
    function calculateRoundEnd(winType, winnerId, loserId) {
        const scoreChanges = { 0: 0, 1: 0, 2: 0, 3: 0 };
        let summary = [];
        
        // --- 0. 预处理 (Pre-check Hextech) ---
        // Prism New 1: 全民皆兵 (别人给你点炮视为你自摸)
        if (winType === 'dianpao') {
            const winner = state.players[winnerId];
            if (playerHasHextechId(winner, 'prism_new_1')) {
                winType = 'zimo';
                summary.push(`【全民皆兵】${winner.name} 将点炮视为自摸！全场买单！`);
            }
        }

        // Gold 7: 杠后余生 (杠开出牌点炮 -> 无效，系统付分)
        // 这里的逻辑是：如果是点炮，且打出的牌是杠上开花后打出的牌
        if (winType === 'dianpao' && state.isGangKaiDiscard) {
            const loser = state.players[loserId];
            if (playerHasHextechId(loser, 'gold_7')) {
                // 变为特殊结算：输家不付分，赢家得分由系统支付
                // 我们可以标记一个 flag，在下面计算分数时处理
                // 或者在这里直接处理，但为了复用逻辑，最好只是标记
                // 但因为逻辑差异大，不如这里直接劫持 winType? 
                // 不，最好加个 flag
                loser.immuneToPayment = true; 
                loser.systemPaysForMe = true; // 系统替我付
                summary.push(`${loser.name} 触发【杠后余生】，点炮无效，由系统支付胡牌分！`);
            }
        }

        // 确定下一局庄家
        if (winType === 'liuju') {
             // 流局，下一个人坐庄
             state.nextDealerId = (state.dealerId + 1) % 4;
        } else {
            if (winnerId === state.dealerId) {
                // 庄家胡牌，连庄
                state.nextDealerId = state.dealerId;
                state.dealerStreak = (state.dealerStreak || 0) + 1; // Increment streak
                summary.push("庄家胡牌，下一局连庄");
            } else {
                // 闲家胡牌，下一个人坐庄
                state.nextDealerId = (state.dealerId + 1) % 4;
                state.dealerStreak = 0; // Reset streak
            }
        }

        // 1. 结算杠分
        state.roundGangScores.forEach(record => {
            let payment = record.score;
            
            // Prism 4: 推倒之王 (胡牌时，未听牌者支付翻倍) - 这里是杠分，不是胡牌分，忽略。
            
            // Gold 10: 刮风下雨 (流局时，杠分有效) - Default implementation is valid.
            // 默认规则：流局杠分是否有效？通常推倒胡流局杠分也算。这里代码里默认算了。
            
            scoreChanges[record.from] -= payment;
            scoreChanges[record.to] += payment;
        });

        if (state.roundGangScores.length > 0) {
            summary.push(`杠分结算完成`);
        }
        
        // Gold 10: 刮风下雨 (流局时，未听牌者额外补偿2分)
        if (winType === 'liuju') {
            state.players.forEach(p => {
                if (playerHasHextechId(p, 'gold_10')) {
                     // 其他未听牌者给p 2分
                     state.players.forEach(other => {
                         if (other.id !== p.id && !other.isTing) {
                             scoreChanges[other.id] -= 2;
                             scoreChanges[p.id] += 2;
                             summary.push(`${other.name} 未听牌，补偿 ${p.name} 2分 (刮风下雨)`);
                         }
                     });
                }
            });
            
            // Silver new 3: 报听补贴 (报听后若流局，系统补偿 3 分)
            state.players.forEach(p => {
                if (playerHasHextechId(p, 'silver_new_3') && p.isTing) {
                    scoreChanges[p.id] += 3;
                    summary.push(`${p.name} 触发【报听补贴】，系统补偿 3 分`);
                }
            });
        }

        // 2. 结算胡牌分
        if (winType !== 'liuju') {
            const dealerId = state.dealerId;
            const winner = state.players[winnerId];
            const isWinnerDealer = (winnerId === dealerId);
            
            // Base Score Modifiers
            let extraWinScore = 0;
            let winMultiplier = 1; // Global multiplier for the winner

            // Gold New 1: 庄家世家 (作为庄家得分从 2 倍收益变为 3 倍)
            let dealerMultiplier = isWinnerDealer ? 2 : 1;
            if (isWinnerDealer && playerHasHextechId(winner, 'gold_new_1')) {
                dealerMultiplier = 3;
                summary.push("【庄家世家】庄家收益提升至 3 倍");
            }
            
            // Gold New 2: 风牌克星 (无风牌时胡牌，胡牌得分额外+5)
            if (playerHasHextechId(winner, 'gold_new_2')) {
                const hasWinds = [...winner.hand, ...winner.peng, ...winner.gang].some(t => t.endsWith('风'));
                if (!hasWinds) {
                    extraWinScore += 5;
                    summary.push("【风牌克星】无风牌，额外+5分");
                }
            }

            // Gold New 3: 连胜风暴 (连胡两局后，后续每局加基础分 3分)
            if (playerHasHextechId(winner, 'gold_new_3') && winner.consecutiveWins >= 2) {
                const bonus = 3 * (winner.consecutiveWins - 1); // 2 wins -> +3, 3 wins -> +6? No "subsequent round add 3 base"
                // Desc: "After winning 2 rounds in a row, add 3 points to base score for each subsequent round."
                // Interpretation: Win #1: 0. Win #2: 0. Win #3: +3. Win #4: +3? Or cumulative?
                // Let's assume constant +3 bonus when streak >= 2. Or +3 per win beyond 2?
                // "add 3 points ... for each subsequent round" usually means +3 per round.
                // Simplified: If streak >= 2, add 3 points.
                extraWinScore += 3;
                summary.push("【连胜风暴】连胜奖励，额外+3分");
            }

            // Gold New 4: 死磕到底 (单钓，胡牌得分额外+5)
            if (playerHasHextechId(winner, 'gold_new_4')) {
                // Check if single wait (remove winning tile, check ting candidates)
                // We need to simulate the hand before winning
                // 1. Clone hand
                const checkHand = [...winner.hand];
                // 2. Remove one winning tile (if zimo, it's in hand. if dianpao, it's pushed before calc)
                // calculateScore pushed lastDiscard to hand before calling this.
                // So checkHand contains the winning tile.
                // We need to find the index of the winning tile and remove it.
                // If there are multiple same tiles, removing any one is fine for checking ting.
                const winTile = (winType === 'zimo') ? winner.hand[winner.hand.length-1] : state.lastDiscard.tile;
                const idx = checkHand.indexOf(winTile);
                if (idx > -1) {
                    checkHand.splice(idx, 1);
                    // 3. Get winning candidates (what tiles could complete this hand)
                    const winningTiles = getWinningTiles(checkHand, winner.wildcardTile);
                    if (winningTiles.length === 1) {
                        extraWinScore += 5;
                        summary.push("【死磕到底】单钓胡牌，额外+5分");
                    }
                }
            }

            // Gold New 6: 快节奏 (前 12 巡胡牌，本回合得分翻倍)
            if (playerHasHextechId(winner, 'gold_new_6') && state.turnCount <= 12) {
                winMultiplier *= 2;
                summary.push("【快节奏】速攻，得分翻倍");
            }

            // Gold New 7: 社交恐怖 (每碰一次牌，本回合胡牌基础分 +2)
            if (playerHasHextechId(winner, 'gold_new_7')) {
                const pengBonus = winner.peng.length * 2;
                if (pengBonus > 0) {
                    extraWinScore += pengBonus;
                    summary.push(`【社交恐怖】碰牌加成，额外+${pengBonus}分`);
                }
            }

            // Gold New 9: 资本家 (每拥有 10 积分，额外 +1)
            if (playerHasHextechId(winner, 'gold_new_9')) {
                const capBonus = Math.floor(Math.max(0, winner.score) / 10);
                if (capBonus > 0) {
                    extraWinScore += capBonus;
                    summary.push(`【资本家】资产分红，额外+${capBonus}分`);
                }
            }

            // Prism New 3: 终结者 (胡牌且有杠，胡牌得分 ×2)
            if (playerHasHextechId(winner, 'prism_new_3') && winner.gang.length > 0) {
                winMultiplier *= 2;
                summary.push("【终结者】胡牌且有杠，得分×2");
            }

            // Prism New 5: 孤注一掷 (报听后无法摸牌，胡牌分 ×5)
            if (playerHasHextechId(winner, 'prism_new_5') && winner.isTing) {
                winMultiplier *= 5;
                summary.push("【孤注一掷】得分×5");
            }

            // Prism New 6: 老当益壮 (第 11 回合后，胡牌翻 5 倍)
            if (playerHasHextechId(winner, 'prism_new_6') && state.turnCount > 11) {
                winMultiplier *= 5;
                summary.push("【老当益壮】后期爆发，得分×5");
            }

            // Prism New 7: 推倒一切 (胡牌时，若手牌没有刻子（全顺子），胡牌得分额外+10)
            if (playerHasHextechId(winner, 'prism_new_7')) {
                if (winner.peng.length === 0 && winner.gang.length === 0) {
                    // Check concealed triplets
                    const counts = {};
                    winner.hand.forEach(t => counts[t] = (counts[t]||0)+1);
                    if (!Object.values(counts).some(c => c >= 3)) {
                        extraWinScore += 10;
                        summary.push("【推倒一切】全顺子，额外+10分");
                    }
                }
            }
            
            // Prism New 10: 轮回 (返还上一局点炮输掉的分数)
            if (playerHasHextechId(winner, 'prism_new_10') && winner.reincarnationScore > 0) {
                // This is added to final score, handled after payments
                summary.push(`【轮回】返还上局损失 ${winner.reincarnationScore} 分`);
            }

            // Prism New 11: 底牌反击 (牌墙剩余不足 10 张时，胡牌得分额外+10)
            if (playerHasHextechId(winner, 'prism_new_11') && state.deck.length < 10) {
                extraWinScore += 10;
                summary.push("【底牌反击】最后时刻，额外+10分");
            }

            // Prism New 12: 不动如山 (不碰、不杠直到胡牌（门清），胡牌得分额外+10)
            if (playerHasHextechId(winner, 'prism_new_12') && winner.peng.length === 0 && winner.gang.length === 0) {
                extraWinScore += 10;
                summary.push("【不动如山】门清，额外+10分");
            }
            
            // Silver new 2: 杠上添花 (结算时若本局有杠，额外得 2 分)
            // 只要本局有杠分记录，或者自己有杠
            if (playerHasHextechId(winner, 'silver_new_2')) {
                // Check if winner has gangs
                if (winner.gang.length > 0) {
                     extraWinScore += 2;
                     summary.push("【杠上添花】额外+2分");
                }
            }

            // Silver new 5: 早起鸟儿 (前 10 巡胡牌额外加 4 分)
            if (playerHasHextechId(winner, 'silver_new_5') && state.turnCount <= 10) {
                extraWinScore += 4;
                summary.push("【早起鸟儿】额外+4分");
            }

            // Silver new 6: 底力 (分数全场最低时，胡牌时总得分 +5)
            const minScore = Math.min(...state.players.map(p => p.score));
            if (playerHasHextechId(winner, 'silver_new_6') && winner.score === minScore) {
                extraWinScore += 5;
                summary.push("【底力】额外+5分");
            }

            // Silver new 7: 收集癖 (胡牌时手牌中有 2 对刻子，额外加 2 分)
            // Includes Peng, Gang, and concealed triplets in hand.
            if (playerHasHextechId(winner, 'silver_new_7')) {
                let tripletCount = winner.peng.length + winner.gang.length;
                // Check concealed triplets
                const handCounts = {};
                winner.hand.forEach(t => handCounts[t] = (handCounts[t] || 0) + 1);
                tripletCount += Object.values(handCounts).filter(c => c >= 3).length;
                
                if (tripletCount >= 2) {
                    extraWinScore += 2;
                    summary.push("【收集癖】额外+2分");
                }
            }

            // Silver new 8: 闲家之光 (作为闲家胡牌时，多收每家 1 分) -> Total +3
            if (playerHasHextechId(winner, 'silver_new_8') && !isWinnerDealer) {
                // Technically "receive 1 from each". So +3 total.
                // We add to extraWinScore. This adds to total payment received.
                // Wait, extraWinScore is added to payment from EACH loser? 
                // Let's check loop below: payment += extraWinScore.
                // If 3 losers, extraWinScore=1 means +3 total. 
                // If 1 loser (dianpao), extraWinScore=1 means +1 total.
                // "多收每家 1 分". 
                // If Zimo: 3 losers. +1 per loser = +3 total. Correct.
                // If Dianpao: 1 loser. +1 from loser = +1 total. 
                // Usually "多收每家" in dianpao context might mean "collect extra from that guy".
                // Or maybe only valid in Zimo? Or "多收 1 分" (from payer).
                // Let's assume +1 per payer.
                extraWinScore += 1;
                summary.push("【闲家之光】每家多收1分");
            }

            // Silver new 10: 环保卫士 (胡牌没有风牌时，得分 +2)
            if (playerHasHextechId(winner, 'silver_new_10')) {
                const allTiles = [...winner.hand, ...winner.peng, ...winner.gang];
                const winds = ['东', '南', '西', '北'];
                if (!allTiles.some(t => winds.some(w => t.includes(w)))) {
                    extraWinScore += 2;
                    summary.push("【环保卫士】额外+2分");
                }
            }

            // Silver new 11: 清仓处理 (手牌少于等于 5 张牌时（多碰/杠）胡牌，加 3 分)
            if (playerHasHextechId(winner, 'silver_new_11')) {
                if (winner.hand.length <= 5) {
                    extraWinScore += 3;
                    summary.push("【清仓处理】额外+3分");
                }
            }

            // Gold 5: 连庄霸主 (连庄>=2, +3 score)
            // Note: dealerStreak updated above. If winner is dealer, check streak.
            // If streak was 1 before (now 2), it counts. 
            // Logic: "第二次及以上当庄" means streak >= 1 (0 is 1st time, 1 is 2nd time)
            if (isWinnerDealer && (state.dealerStreak >= 1 || (state.dealerStreak === undefined && false)) && playerHasHextechId(winner, 'gold_5')) {
                extraWinScore += 3;
                summary.push("【连庄霸主】额外+3分");
            }
            
            if (winType === 'dianpao') {
                let baseScore = 1;
                let multiplier = 1;
                
                // 庄家翻倍规则
                if (isWinnerDealer) multiplier *= 2;
                if (loserId === dealerId) multiplier *= 2;
                
                // Prism 6: 庄家杀手 (你是闲家，庄家点炮 -> 3x)
                // winner != dealer, loser == dealer.
                if (!isWinnerDealer && loserId === dealerId && playerHasHextechId(winner, 'prism_6')) {
                    multiplier = 3; // Replace normal multiplier? Or 3x total? 
                    // "庄家需支付你三倍的分数" -> implies total payment x3 instead of x2.
                    // Usually dealer pays x2. Now x3.
                    // If we assume standard is x2, this replaces it with x3.
                }

                let finalScore = baseScore * multiplier + extraWinScore;
                finalScore = Math.floor(finalScore * winMultiplier); // Apply Global Multiplier
                
                // --- 海克斯效果 (Hextech Effects) ---
                const loser = state.players[loserId];

                // Prism New 10: 轮回 (记录点炮损失)
                if (playerHasHextechId(loser, 'prism_new_10')) {
                    loser.nextReincarnationScore = finalScore;
                    summary.push(`${loser.name} 触发【轮回】记录损失，下局胡牌可返还`);
                }

                // Silver new 1: 省钱专家 (点炮时少支付 1 分)
                if (playerHasHextechId(loser, 'silver_new_1')) {
                    finalScore = Math.max(0, finalScore - 1);
                    summary.push(`${loser.name} 触发【省钱专家】，少支付 1 分`);
                }

                // Silver new 9: 稳扎稳打 (点炮重置)
                if (playerHasHextechId(loser, 'silver_new_9')) {
                    loser.consecutiveNoDealIn = 0;
                    summary.push(`${loser.name} 点炮，【稳扎稳打】计数重置`);
                }
                
                // Gold 8: 精准打击 - 点炮给庄家只需支付1分
                if (isWinnerDealer && playerHasHextechId(loser, 'gold_8')) {
                    finalScore = 1; // Ignore extraWinScore? Description: "只需支付1分".
                    summary.push(`${loser.name} 触发【精准打击】，点炮庄家只付1分！`);
                }
                
                // Prism 4: 推倒之王 (未听牌者支付翻倍)
                if (playerHasHextechId(winner, 'prism_4') && !loser.isTing) {
                    finalScore *= 2;
                    summary.push("【推倒之王】未听牌点炮，分数翻倍");
                }
                
                // Gold 7: 杠后余生 System Pay
                if (loser.systemPaysForMe) {
                    scoreChanges[winnerId] += finalScore;
                    summary.push(`系统替 ${loser.name} 支付 ${finalScore} 分`);
                    // loser pays 0
                } else {
                    // Prism 7: 不破金身 (免单2次)
                    // Removed

                    scoreChanges[loserId] -= finalScore;
                    scoreChanges[winnerId] += finalScore;
                }
                
                if (!loser.systemPaysForMe) { // Check again for log
                     summary.push(`${state.players[loserId].name} 点炮给 ${state.players[winnerId].name}，输 ${finalScore} 分`);
                }

            } else if (winType === 'zimo' || winType === 'gangkai') {
                let baseScore = (winType === 'gangkai') ? 4 : 2; // 杠开4分，自摸2分
                
                // Prism 1: 杠上开花·极 (4->8, Dealer 16)
                // Removed
                
                // Silver 4: 边张好手 (胡3/7自摸，每家+1)
                // Check if winning tile is 3 or 7
                const winningTile = winner.hand[winner.hand.length-1]; // Last tile is winning tile
                if (['三','七'].some(x => winningTile.startsWith(x)) && playerHasHextechId(winner, 'silver_4')) {
                    // This is per player +1. So we can add to baseScore? 
                    // No, baseScore is multiplied. This is "extra +1". 
                    // Let's handle it in loop.
                }

                // Gold 2: 庄家威严 (Dealer Zimo -> Others pay 6)
                // If dealer zimo, baseScore usually 2. Multiplier 2 -> 4. 
                // Description: "闲家需支付6分". 
                // So if dealer zimo, force payment to 6.
                let forcePayment = 0;
                if (isWinnerDealer && playerHasHextechId(winner, 'gold_2')) {
                    forcePayment = 6;
                    summary.push("【庄家威严】闲家支付6分");
                }
                
                // Gold 6: 绝地翻盘 (Last place Zimo -> x2)
                let isLastPlace = false;
                const minScore = Math.min(...state.players.map(p => p.score));
                if (winner.score === minScore && playerHasHextechId(winner, 'gold_6')) {
                    isLastPlace = true;
                    summary.push("【绝地翻盘】最后一名自摸，分数翻倍");
                }
                
                state.players.forEach(p => {
                    if (p.id !== winnerId) {
                        let payment = 0;
                        
                        if (forcePayment > 0) {
                            payment = forcePayment;
                        } else {
                            let multiplier = 1;
                            if (isWinnerDealer) multiplier *= 2;
                            if (p.id === dealerId) multiplier *= 2;
                            
                // Prism 1: Dealer pays 16 (Base 8 * 2 = 16). Correct.
                            
                            // Prism 6: 庄家杀手 (你是闲家，自摸，庄家付3x)
                            // winner != dealer. p == dealer.
                            if (!isWinnerDealer && p.id === dealerId && playerHasHextechId(winner, 'prism_6')) {
                                multiplier = 3; // 3x
                            }
                            
                            payment = baseScore * multiplier;
                        }
                        
                        // Add extras
                        payment += extraWinScore;
                        
                        // Apply Global Multiplier
                        payment = Math.floor(payment * winMultiplier);

                        // Silver 4
                        if (['三','七'].some(x => winningTile.startsWith(x)) && playerHasHextechId(winner, 'silver_4')) {
                            payment += 1;
                        }
                        
                        // Gold 6
                        if (isLastPlace) {
                            payment *= 2;
                        }
                        
                        // Prism 4: 推倒之王 (未听牌者支付翻倍)
                        if (playerHasHextechId(winner, 'prism_4') && !p.isTing) {
                            payment *= 2;
                        }

                        // Prism 7: 不破金身
                        // Removed
                        
                        scoreChanges[p.id] -= payment;
                        scoreChanges[winnerId] += payment;
                    }
                });
                
                summary.push(`${state.players[winnerId].name} ${winType === 'gangkai' ? '杠上开花' : '自摸'}，三家共赔付 ${scoreChanges[winnerId] - (state.roundGangScores.filter(r=>r.to===winnerId).reduce((a,b)=>a+b.score,0))} 分(不含杠分)`);
            }
        } else {
            summary.push("流局，无胡牌分变化");
        }

        // --- Post-Calculation Hextech Effects ---
        // Silver new 9: 稳扎稳打 (每连续 3 局不点炮，获得 4 分奖励)
        state.players.forEach(p => {
            if (playerHasHextechId(p, 'silver_new_9')) {
                // If I was the loser in dianpao, I dealt in.
                const dealtIn = (winType === 'dianpao' && loserId === p.id);
                
                if (!dealtIn) {
                    p.consecutiveNoDealIn = (p.consecutiveNoDealIn || 0) + 1;
                    // summary.push(`${p.name} 本局未点炮，稳扎稳打计数: ${p.consecutiveNoDealIn}`); // Debug
                    
                    if (p.consecutiveNoDealIn >= 3) {
                        scoreChanges[p.id] += 4;
                        summary.push(`${p.name} 触发【稳扎稳打】，连续3局未点炮，奖励 4 分！`);
                        p.consecutiveNoDealIn = 0; // Reset
                    }
                }
            }
        });

        // 3. 更新总分 & 状态更新
        state.players.forEach(p => {
            p.score += scoreChanges[p.id];
            
            // Prism New 10: 轮回 (Apply returned score)
            if (p.id === winnerId && playerHasHextechId(p, 'prism_new_10') && p.reincarnationScore > 0) {
                p.score += p.reincarnationScore;
                // Add to change for display
                scoreChanges[p.id] += p.reincarnationScore; 
            }
            
            // Update Reincarnation Score for next round
            p.reincarnationScore = p.nextReincarnationScore || 0;
            p.nextReincarnationScore = 0;
            
            // Update Consecutive Wins
            if (winType !== 'liuju' && p.id === winnerId) {
                p.consecutiveWins = (p.consecutiveWins || 0) + 1;
            } else {
                p.consecutiveWins = 0;
            }
        });

        // 4. 清空本局杠分
        state.roundGangScores = [];

        // 5. 生成最终显示文本
        let resultText = "<div style='text-align:left; font-size:18px;'>";
        resultText += "<h3>本局结算</h3>";
        if (summary.length > 0) {
            resultText += "<ul>" + summary.map(s => `<li>${s}</li>`).join('') + "</ul>";
        }
        resultText += "<hr><h4>当前总积分:</h4><ul>";
        state.players.forEach(p => {
            const change = scoreChanges[p.id];
            const changeStr = change >= 0 ? `+${change}` : `${change}`;
            const color = change >= 0 ? '#ff4d4d' : '#4facfe'; // Red for win, Blue for lose
            resultText += `<li>${p.name}: <span style="color:${color}; font-weight:bold;">${p.score}</span> (本局 ${changeStr})</li>`;
        });
        resultText += "</ul></div>";

        return resultText;
    }

        if (!player || !player.hextechs) return false;
        return player.hextechs.some(h => (typeof h === 'string' ? h === hId : h.id === hId));
    }

    function startHextechTimer() {
        if (state.hextechTimerId) clearInterval(state.hextechTimerId);
        let timeLeft = 40;
        const timerEl = document.getElementById('hextech-timer');
        
        state.hextechTimerId = setInterval(() => {
            timeLeft--;
            if (timerEl) timerEl.textContent = timeLeft + 's';
            
            if (timeLeft <= 0) {
                const human = state.players[0];
                if (state.hextechSelectionPending && human.hextechOptions.length > 0) {
                    const randomChoice = human.hextechOptions[Math.floor(Math.random() * human.hextechOptions.length)];
                    selectHextech(randomChoice.id);
                } else {
                    endHextechSelection();
                }
            }
        }, 1000);
    }
